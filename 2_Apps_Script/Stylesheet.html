<style>
  /* =====================================================================
     Material 3 style: tonal surfaces, Roboto, 8 / 12 / 28 px shapes, Sign Store red as primary
     ===================================================================== */
  :root {
    --primary: #B3261E;            /* Sign Store red, tuned for text contrast */
    --on-primary: #FFFFFF;
    --primary-container: #FADEDC;
    --on-primary-container: #5C0B07;
    --secondary-container: #E2E8F4;
    --on-secondary-container: #1B2D4C;
    --surface: #F6F7FA;
    --surface-low: #FFFFFF;
    --surface-container: #EEF1F6;
    --surface-high: #E5E9F0;
    --on-surface: #1B1F27;
    --on-surface-variant: #4A5160;
    --outline: #79808E;
    --outline-variant: #D3D8E1;
    --inverse-surface: #2E3138;
    --gold: #9A6B00;
    --elev-1: 0 1px 2px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .06);
    --elev-2: 0 2px 6px rgba(16, 24, 40, .10), 0 1px 2px rgba(16, 24, 40, .06);
    --elev-3: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);
    --font: Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  body { font-family: var(--font); background: var(--surface); color: var(--on-surface); margin: 0; height: 100vh; overflow: hidden;
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; accent-color: var(--primary); }
  h1, h2, h3 { margin: 0; color: var(--on-surface); font-weight: 500; }
  .screen { flex: 1; min-height: 0; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  #loading { margin: 48px auto; padding: 20px 24px; font-size: 16px; font-weight: 500; color: var(--on-surface-variant); background: var(--surface-low);
             border-radius: 12px; box-shadow: var(--elev-1); }

  /* ---------- Top bar + stepper ---------- */
  #topbar { height: 60px; flex-shrink: 0; background: var(--surface-low); color: var(--on-surface); display: flex; align-items: center;
            justify-content: space-between; gap: 16px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--outline-variant); }
  .brand { font-weight: 500; font-size: 17px; display: flex; align-items: center; white-space: nowrap; }
  .brand::before { content: ''; display: inline-block; width: 22px; height: 22px; background: var(--primary); border-radius: 7px; margin-right: 10px;
                   box-shadow: inset -6px -6px 0 rgba(0, 0, 0, .14); }
  .stepper { display: flex; align-items: center; height: 36px; border: 1px solid var(--outline); border-radius: 18px; overflow: hidden; font-size: 13px; }
  .step { color: var(--on-surface); cursor: pointer; padding: 0 16px; height: 100%; display: flex; align-items: center; font-weight: 500; white-space: nowrap; }
  .step:hover { background: var(--surface-container); }
  .step.active { background: var(--secondary-container); color: var(--on-secondary-container); }
  .step.done { color: var(--on-surface-variant); }
  .step-sep { width: 1px; height: 100%; background: var(--outline); color: transparent; overflow: hidden; }
  .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 12px; color: var(--on-surface-variant); min-width: 120px; }
  #page-count { margin-right: 4px; white-space: nowrap; }
  .proof-status { align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--surface-container);
                  color: var(--on-surface); font-weight: 500; white-space: nowrap; }
  .ps-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E7D4F; }
  .ps-time { color: var(--on-surface-variant); font-weight: 400; }

  /* ---------- Buttons (filled / tonal / plain text) ---------- */
  .btn-filled, .btn-tonal, .btn-plain { width: auto; height: 36px; padding: 0 16px; border: none; border-radius: 18px; font: 500 13px var(--font);
                                        letter-spacing: .1px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
  .btn-filled { background: var(--primary); color: var(--on-primary); }
  .btn-filled:hover { box-shadow: var(--elev-1); filter: brightness(1.06); }
  .btn-filled:disabled { background: var(--surface-high); color: var(--outline); box-shadow: none; filter: none; cursor: default; }
  .btn-tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
  .btn-tonal:hover { box-shadow: var(--elev-1); filter: brightness(.98); }
  .btn-plain { background: transparent; color: var(--primary); padding: 0 12px; }
  .btn-plain:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .primary-btn { background: var(--primary); color: var(--on-primary); border: none; height: 44px; padding: 0 24px; font: 500 14px var(--font);
                 letter-spacing: .1px; border-radius: 22px; cursor: pointer; }
  .primary-btn:hover { box-shadow: var(--elev-2); filter: brightness(1.06); }
  .primary-btn:disabled { background: var(--surface-high); color: var(--outline); cursor: default; box-shadow: none; filter: none; }
  .primary-btn.full { width: 100%; margin: 16px 0 8px; }
  .link-btn { color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 16px; }
  .link-btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }

  /* ---------- Step 1: dashboard ---------- */
  #step-select { flex-direction: column; background: var(--surface); }
  .dash { flex: 1; overflow-y: auto; padding: 28px 40px 24px; }
  .dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
  .dash-head h1 { font-size: 28px; font-weight: 400; margin-bottom: 6px; }
  .dash-head p { margin: 0; color: var(--on-surface-variant); font-size: 14px; line-height: 1.45; max-width: 640px; }
  .dash-tools { display: flex; gap: 10px; align-items: center; }
  #cat-search { width: 320px; height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: var(--surface-high); font-size: 14px; }
  #cat-search:focus { outline: 2px solid var(--primary); box-shadow: none; background: var(--surface-low); }
  .dash h3 { font-size: 15px; font-weight: 500; color: var(--on-surface); margin: 22px 0 10px; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cat-card { --cat: #7A7F87; display: flex; gap: 12px; align-items: flex-start; background: var(--surface-low); position: relative; margin: 0;
              border: 2px solid var(--cat); border-radius: 12px; padding: 13px 14px; cursor: pointer; text-transform: none; white-space: normal;
              font-weight: normal; transition: box-shadow .15s, background .15s; }
  .cat-card:hover { box-shadow: var(--elev-2); }
  .cat-card.selected { background: color-mix(in srgb, var(--cat) 9%, var(--surface-low)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cat) 28%, transparent); }
  .cat-card input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--cat); }
  .cat-icon { flex: none; width: 40px; height: 40px; color: var(--cat, var(--primary)); display: inline-flex; }
  .cat-svg { width: 40px; height: 40px; display: block; }
  .cat-name { font-weight: 500; font-size: 14.5px; color: var(--cat, var(--on-surface)); margin-bottom: 3px; }
  .cat-desc { font-size: 12px; color: var(--on-surface-variant); line-height: 1.4; }
  .cat-order { position: absolute; top: 8px; right: 10px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 700;
               color: #fff; background: var(--cat); display: none; align-items: center; justify-content: center; }
  .cat-card.selected .cat-order { display: inline-flex; }
  .cat-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; }
  .legend-chip { display: inline-flex; align-items: center; gap: 6px; width: auto; height: 32px; padding: 0 12px; border: 1px solid var(--outline-variant);
                 border-radius: 8px; font: 500 12.5px var(--font); color: var(--on-surface-variant); background: var(--surface-low); cursor: pointer; }
  .legend-chip:hover { border-color: var(--cat); color: var(--cat); }
  .legend-chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--cat); }
  .legend-chip.on { background: var(--cat); border-color: var(--cat); color: #fff; }
  .legend-chip.on i { background: #fff; width: 12px; height: 12px; border-radius: 0;
                      clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 26%, 86% 12%, 38% 72%); }
  .legend-clear { width: auto; height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: transparent; color: var(--primary);
                  font: 500 12.5px var(--font); cursor: pointer; }
  .legend-clear:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .dash-footer { flex-shrink: 0; background: var(--surface-low); border-top: 1px solid var(--outline-variant); padding: 12px 40px;
                 display: flex; justify-content: flex-end; align-items: center; gap: 16px; }

  /* ---------- Steps 2-3 layout ---------- */
  #step-build { display: flex; min-height: 0; }
  #sidebar { width: 480px; flex-shrink: 0; background: var(--surface-low); padding: 18px 20px 32px; overflow-y: auto; border-right: 1px solid var(--outline-variant); z-index: 10; }
  .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .side-head h2 { font-size: 20px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
  #preview-area { flex: 1; overflow: auto; padding: 28px; background: #E8EBF0; }
  #sheets { max-width: 1100px; margin: 0 auto; }
  .sheet { background: #fff; margin: 0 auto 28px; box-shadow: var(--elev-2); border-radius: 2px; line-height: 0; }
  .sheet svg { width: 100%; height: auto; display: block; }

  /* ---------- Item / part cards ---------- */
  .item-panel { background: var(--surface-container); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
  .item-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--on-surface); }
  .item-header:hover { background: var(--surface-high); }
  .item-name { font-weight: 500; font-size: 15px; }
  .item-pages { font-size: 12px; color: var(--on-surface-variant); margin-right: 10px; padding: 2px 8px; border-radius: 8px; background: var(--surface-low); }
  .item-caret { color: var(--on-surface-variant); }
  .item-body { padding: 0 10px 10px; }
  .part-card { border: 1px solid var(--outline-variant); border-radius: 12px; background: var(--surface-low); padding: 12px; margin-bottom: 10px; }
  .part-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--surface-high); }
  .part-title { font-size: 14px; font-weight: 500; color: var(--primary); }
  .part-title-input { font: 500 14px var(--font); color: var(--primary); border: 1px solid transparent; border-radius: 8px; background: transparent;
                      padding: 4px 8px; margin: 0 8px 0 -8px; flex: 1; min-width: 0; max-width: 340px; height: auto; box-shadow: none; text-transform: none; }
  .part-title-input:hover { border-color: var(--outline-variant); background: var(--surface); }
  .part-title-input:focus { outline: none; border-color: var(--primary); background: var(--surface-low); box-shadow: none; }
  .part-title-input::placeholder { color: #E3A19C; }
  .part-notes { margin-top: 10px; padding: 10px 12px; background: #FFF8E6; border-radius: 10px; border: 1px solid #F1DFAE; }
  .part-notes .part-toggle { color: var(--gold); font-weight: 500; font-size: 12px; }
  .part-notes-text { width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--outline-variant); border-radius: 8px; resize: vertical;
                     font: 13px var(--font); min-height: 64px; background: var(--surface-low); }
  .part-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-surface-variant); cursor: pointer; text-transform: none; margin: 0; font-weight: 400; }
  .part-toggle input { width: 16px; height: 16px; margin: 0; }
  .part-remove { color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 500; margin-left: 10px; text-transform: none; }
  .part-remove:hover { text-decoration: underline; }

  /* tonal "add" buttons (+ Add Another, + Add Letters, + Add Color, + Add Row, + Add Section, + Add Blank Page) */
  .add-part-btn, .add-letters-btn, .add-color-btn { background: var(--secondary-container) !important; color: var(--on-secondary-container) !important;
              border: none !important; border-radius: 18px !important; height: 36px; font: 500 13px var(--font) !important; justify-content: center !important;
              text-align: center; padding: 0 16px !important; margin-bottom: 10px; }
  .add-part-btn:hover, .add-letters-btn:hover, .add-color-btn:hover { box-shadow: var(--elev-1); filter: brightness(.98); }
  .add-letters-btn, .add-color-btn { width: auto !important; margin-top: 8px; margin-bottom: 0; height: 32px; }

  /* ---------- Form fields (outlined) ---------- */
  .zone-group { margin-bottom: 10px; background: var(--surface); padding: 10px; border-radius: 10px; }
  .zone-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .form-group { flex: 1 1 0; min-width: 75px; display: flex; flex-direction: column; }
  .form-group.wide-field { flex-basis: 100%; }
  .form-group.cc-open { flex: 1 1 100%; max-width: 100%; }
  .flex-break { flex-basis: 100%; height: 0; }
  label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); letter-spacing: .2px; margin-bottom: 4px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select, input, textarea, .swatch-btn { width: 100%; padding: 0 10px; border: 1px solid var(--outline-variant); border-radius: 8px; font: 13px var(--font);
                                         height: 36px; background: var(--surface-low); color: var(--on-surface); }
  select:hover, input:hover, textarea:hover { border-color: var(--outline); }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  input[type=checkbox], input[type=radio] { width: 16px; height: 16px; padding: 0; box-shadow: none; }
  input[readonly] { background: var(--surface); color: var(--on-surface-variant); }
  textarea { height: auto; padding: 8px 10px; resize: vertical; }
  .swatch-btn { background: var(--surface-container); border-color: transparent; cursor: pointer; font-weight: 500; text-align: left;
                display: flex; align-items: center; justify-content: space-between; }
  .swatch-btn:hover { background: var(--surface-high); }
  .btn-color-indicator { width: 18px; height: 18px; border: 1px solid rgba(0, 0, 0, .25); display: inline-block; border-radius: 50%; flex-shrink: 0; overflow: hidden; }
  .btn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
  .dims-row { display: flex; gap: 6px; }
  .dim-box { flex: 1; display: flex; align-items: center; border: 1px solid var(--outline-variant); border-radius: 8px; background: var(--surface-low); overflow: hidden; }
  .dim-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .dim-box span { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); padding: 0 6px 0 8px; }
  .dim-box input { border: none; border-radius: 0; min-width: 0; box-shadow: none !important; }
  .fullcolor-chip { height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500;
                    background: linear-gradient(90deg, #ffd6d6, #fff0c2, #d6ffd6, #d6e6ff, #ecd6ff); }
  .calc-field { background: #E7F4EA !important; color: #1E5631 !important; font-weight: 500; border-color: transparent !important; }

  /* custom CMYK / RGB panel */
  .cc-panel { margin-top: 6px; padding: 10px; border: 1px solid var(--outline-variant); border-radius: 10px; background: var(--surface-low); width: 100%; }
  .cc-panel .cc-name { width: 100%; margin-bottom: 6px; }
  .cc-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .cc-row input { width: 64px; min-width: 0; padding: 0 4px; text-align: center; }
  .cc-row input.cc-approx { background: #FFF8E6; color: var(--gold); font-style: italic; }
  .cc-lab { width: 40px; font-size: 11px; font-weight: 500; color: var(--on-surface-variant); }
  .cc-swatch { width: 28px; height: 28px; margin-left: 6px; border: 1px solid rgba(0, 0, 0, .25); border-radius: 50%; background: #fff; }
  .cc-note { font-size: 11px; color: var(--on-surface-variant); }
  .cc-hex { width: 104px !important; text-transform: uppercase; }
  .cc-match:empty { display: none; }
  .cc-match { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--surface-high); }
  .ccm-head { font-size: 12px; font-weight: 500; color: var(--on-surface); margin-bottom: 6px; }
  .ccm-head span { font-weight: 400; color: var(--on-surface-variant); margin-left: 6px; font-size: 11px; }
  .ccm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 4px; }
  .ccm-lab { width: 100%; font-size: 11px; color: var(--on-surface-variant); }
  .ccm-chip { display: inline-flex; align-items: center; gap: 6px; width: auto; max-width: 100%; height: 28px; padding: 0 8px 0 4px; border: 1px solid var(--outline-variant);
              border-radius: 14px; background: var(--surface-low); font: 12px var(--font); color: var(--on-surface); cursor: pointer; white-space: nowrap; overflow: hidden; }
  .ccm-chip:hover { border-color: var(--primary); background: var(--surface); }
  .ccm-chip i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); flex: none; }
  .ccm-chip small { color: var(--on-surface-variant); font-size: 11px; }
  .cc-toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--on-surface-variant); font-weight: 400; cursor: pointer; }
  .cc-toggle input { margin: 0; }

  /* blank pages, letter lines, vinyl colors */
  .item-blanks .blank-row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 8px 10px; border: 1px dashed var(--outline); border-radius: 10px; background: var(--surface-low); }
  .blank-row .blank-lab { font-size: 12px; font-weight: 500; color: var(--primary); white-space: nowrap; }
  .blank-row input { flex: 1; min-width: 0; }
  .letter-line { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--outline-variant); }
  .letter-line label .part-remove { margin-left: 8px; }
  .color-line { border-top: 1px dashed var(--outline-variant); margin-top: 8px; padding-top: 6px; }
  .color-line-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: 4px; }

  /* custom tables */
  .custom-new { display: flex; flex-direction: column; gap: 6px; text-align: left; background: transparent; border: 1.5px dashed var(--primary);
                color: var(--primary); border-radius: 12px; padding: 14px 16px; cursor: pointer; font: inherit; }
  .custom-new b { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14.5px; }
  .custom-new .cat-icon, .custom-new .cat-svg { width: 30px; height: 30px; }
  .custom-new span { color: var(--on-surface-variant); font-size: 12px; line-height: 1.4; }
  .custom-new:hover { background: color-mix(in srgb, var(--primary) 6%, transparent); }
  .custom-card { cursor: default; }
  .custom-card .custom-name { width: 100%; font-weight: 500; font-size: 14px; height: 32px; margin-bottom: 4px; }
  .custom-x { position: absolute; bottom: 6px; right: 10px; font-size: 18px; }
  .custom-item-name { margin: 0 0 10px; } .custom-item-name label { display: block; }
  .custom-item-name input { width: 100%; }
  .custom-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
  .custom-controls .add-part-btn { width: auto; margin: 0; }
  .custom-add-comp { flex: 1; min-width: 160px; border-radius: 18px; }
  .cr-legend { display: flex; gap: 6px; font-size: 11px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: 4px; }
  .cr-legend span:first-child { flex: 1; } .cr-legend span:nth-child(2) { width: 112px; } .cr-legend span:nth-child(3) { width: 84px; }
  .cr-row { border: 1px solid var(--outline-variant); border-radius: 10px; padding: 8px; margin-bottom: 6px; background: var(--surface-low); }
  .cr-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .cr-title { flex: 1; min-width: 0; padding-left: 8px; padding-right: 4px; font-weight: 500; text-transform: uppercase; }
  .cr-type { width: 112px; flex: none; padding-left: 6px; padding-right: 2px; } .cr-col { width: 62px; flex: none; padding-left: 6px; padding-right: 2px; }
  .cr-x { font-size: 18px; padding: 0 4px; }
  .cr-row .form-group { width: 100%; flex: 1 1 100%; margin: 0; } .cr-row .form-group > label:first-child { display: none; }
  .cr-row .flex-break { display: none; }
  .cr-draw { margin: 8px 0 10px; font-size: 13px; } .cr-draw summary { cursor: pointer; font-weight: 500; color: var(--on-surface-variant); }
  .cr-draw-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  /* ---------- Customer form ---------- */
  .cf-note { font-size: 13px; color: var(--on-surface-variant); background: #FFF8E6; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; line-height: 1.4; }
  .cf-row { display: flex; gap: 12px; }
  .cf-row .cf-group { flex: 1; }
  .cf-group { margin-bottom: 14px; display: flex; flex-direction: column; position: relative; }
  .cf-group input:not([type=checkbox]) { height: 40px; }
  .cf-group.missing input { border-color: #D6A100; background: #FFFDE7; }
  .cf-group.missing label::after { content: 'MISSING'; margin-left: 6px; background: #fff200; color: #d60000; padding: 0 5px; border-radius: 4px; font-size: 9px; font-weight: 700; }
  .cf-help { font-size: 12px; color: var(--on-surface-variant); margin-top: 4px; line-height: 1.4; }
  .cf-check { display: inline-flex !important; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 400; color: var(--on-surface); text-transform: none; cursor: pointer; }
  .cf-check input { margin: 0; }
  .cf-group.missing label.cf-check::after { content: none; }

  /* ---------- Dialogs (swatches, help, save, library) ---------- */
  #swatch-modal, #help-modal, .dialog-scrim { display: none; position: fixed; inset: 0; background: rgba(15, 20, 30, .45); z-index: 1000; align-items: center; justify-content: center; }
  #help-modal { z-index: 1001; }
