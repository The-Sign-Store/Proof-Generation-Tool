<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #222; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  h1, h2, h3 { margin: 0; color: #333; }
  .screen { flex: 1; min-height: 0; }
  #loading { margin: 40px auto; padding: 20px; font-size: 18px; font-weight: bold; color: #666; background: #fff; border-radius: 8px; border: 2px solid #ddd; }

  /* ---------- Top bar + stepper ---------- */
  #topbar { height: 52px; flex-shrink: 0; background: #231f20; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .brand { font-weight: bold; font-size: 16px; letter-spacing: .5px; }
  .brand::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #c1272d; border-radius: 2px; margin-right: 8px; }
  .stepper { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .step { color: #999; cursor: pointer; padding: 6px 12px; border-radius: 20px; }
  .step.active { background: #ebba34; color: #000; font-weight: bold; }
  .step.done { color: #fff; }
  .step-sep { color: #666; }
  .topbar-right { font-size: 12px; color: #bbb; min-width: 120px; text-align: right; }

  /* ---------- Buttons ---------- */
  .primary-btn { background: #ebba34; color: #000; border: none; padding: 13px 22px; font-size: 15px; font-weight: bold; border-radius: 40px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.2); height: auto; }
  .primary-btn:disabled { background: #ccc; color: #777; cursor: default; box-shadow: none; }
  .primary-btn.full { width: 100%; margin: 15px 0 8px; }
  .link-btn { color: #0050b3; cursor: pointer; font-size: 12px; font-weight: bold; }

  /* ---------- Step 1: dashboard ---------- */
  #step-select { flex-direction: column; background: #f3f4f6; }
  .dash { flex: 1; overflow-y: auto; padding: 30px 40px 20px; }
  .dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-bottom: 24px; }
  .dash-head h1 { font-size: 24px; margin-bottom: 6px; }
  .dash-head p { margin: 0; color: #666; font-size: 13px; max-width: 640px; }
  #cat-search { width: 300px; height: 38px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .dash h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 18px 0 10px; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .cat-card { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 2px solid #e1e3e8; border-radius: 10px; padding: 14px; cursor: pointer; position: relative; transition: border-color .1s, box-shadow .1s; text-transform: none; white-space: normal; margin: 0; font-weight: normal; }
  .cat-card:hover { border-color: #b8bcc6; }
  .cat-card.selected { border-color: #c1272d; box-shadow: 0 0 0 3px rgba(193,39,45,.12); }
  .cat-card input { width: 16px; height: 16px; margin: 2px 0 0; flex-shrink: 0; }
  .cat-name { font-weight: bold; font-size: 14px; color: #222; margin-bottom: 4px; }
  .cat-desc { font-size: 11.5px; color: #777; line-height: 1.35; }
  .cat-order { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: bold; color: #c1272d; }
  .dash-footer { flex-shrink: 0; background: #fff; border-top: 1px solid #ddd; padding: 14px 40px; display: flex; justify-content: flex-end; align-items: center; gap: 24px; }

  /* ---------- Steps 2-3 layout ---------- */
  #step-build { display: flex; min-height: 0; }
  #sidebar { width: 460px; flex-shrink: 0; background: #fff; padding: 18px 20px 30px; overflow-y: auto; box-shadow: 5px 0 15px rgba(0,0,0,.5); z-index: 10; }
  .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .side-head h2 { font-size: 18px; }
  #preview-area { flex: 1; overflow: auto; padding: 30px; background: #222; }
  #sheets { max-width: 1100px; margin: 0 auto; }
  .sheet { background: #fff; margin: 0 auto 30px; box-shadow: 0 20px 50px rgba(0,0,0,.5); line-height: 0; }
  .sheet svg { width: 100%; height: auto; display: block; }

  /* ---------- Item / part cards ---------- */
  .item-panel { border: 2px solid #231f20; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .item-header { background: #231f20; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .item-name { font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; }
  .item-pages { font-size: 11px; color: #ebba34; margin-right: 10px; }
  .item-body { padding: 10px; background: #fafafa; }
  .part-card { border: 2px solid #ddd; border-radius: 8px; background: #fdfdfd; padding: 12px; margin-bottom: 10px; }
  .part-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 10px; }
  .part-title { font-size: 13px; font-weight: bold; color: #c1272d; text-transform: uppercase; letter-spacing: .5px; }
  .part-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #333; cursor: pointer; text-transform: none; margin: 0; }
  .part-toggle input { width: auto; height: auto; margin: 0; }
  .part-remove { color: #c1272d; cursor: pointer; font-size: 11px; font-weight: bold; margin-left: 10px; }
  .add-part-btn { justify-content: center !important; background: #e6f7ff !important; border-color: #91d5ff !important; color: #0050b3 !important; margin-bottom: 10px; }

  /* ---------- Form fields ---------- */
  .zone-group { margin-bottom: 12px; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #e0e0e0; }
  .zone-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .form-group { flex: 1 1 0; min-width: 75px; display: flex; flex-direction: column; }
  .form-group.wide-field { flex-basis: 100%; }
  .flex-break { flex-basis: 100%; height: 0; }
  label { font-size: 10px; font-weight: bold; color: #555; text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select, input, textarea, .swatch-btn { width: 100%; padding: 8px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; height: 34px; font-family: Arial, sans-serif; }
  textarea { height: auto; resize: vertical; }
  .swatch-btn { background: #e0e0e0; cursor: pointer; font-weight: bold; text-align: left; display: flex; align-items: center; justify-content: space-between; }
  .swatch-btn:hover { background: #d0d0d0; }
  .btn-color-indicator { width: 16px; height: 16px; border: 1px solid #999; display: inline-block; border-radius: 3px; flex-shrink: 0; overflow: hidden; }
  .btn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 5px; }
  .dims-row { display: flex; gap: 6px; }
  .dim-box { flex: 1; display: flex; align-items: center; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .dim-box span { font-size: 10px; font-weight: bold; color: #888; padding: 0 5px; }
  .dim-box input { border: none; border-left: 1px solid #eee; border-radius: 0 4px 4px 0; min-width: 0; }
  .fullcolor-chip { height: 34px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #333; background: linear-gradient(90deg, #ffd6d6, #fff0c2, #d6ffd6, #d6e6ff, #ecd6ff); }

  /* ---------- Customer form ---------- */
  .cf-note { font-size: 12px; color: #555; background: #fffbe6; border: 1px solid #f0de8c; border-radius: 6px; padding: 8px 10px; margin-bottom: 14px; }
  .cf-row { display: flex; gap: 12px; }
  .cf-row .cf-group { flex: 1; }
  .cf-group { margin-bottom: 12px; display: flex; flex-direction: column; position: relative; }
  .cf-group.missing input { border-color: #d6a100; background: #fffde0; }
  .cf-group.missing label::after { content: 'MISSING'; margin-left: 6px; background: #fff200; color: #d60000; border: 1px dashed #d6a100; padding: 0 4px; border-radius: 3px; font-size: 9px; }
  .cf-help { font-size: 11px; color: #777; margin-top: 4px; line-height: 1.35; }

  /* ---------- Swatch modal ---------- */
  #swatch-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000; align-items: center; justify-content: center; }
  .modal-content { background: #fff; width: 85%; max-width: 1000px; max-height: 85vh; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .modal-header { padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; border-radius: 8px 8px 0 0; }
  .modal-header h3 { font-size: 20px; }
  .close-btn { font-size: 28px; cursor: pointer; color: #888; font-weight: bold; }
  .close-btn:hover { color: #d00; }
  #swatch-grid { padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
  .swatch-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; background: #fff; transition: transform .1s, box-shadow .1s; }
  .swatch-card:hover { transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,.2); border-color: #888; }
  .swatch-card-color { height: 50px; width: 50px; border-radius: 50%; border: 1px solid #999; margin-bottom: 10px; overflow: hidden; }
  .swatch-card-color svg { display: block; }
  .swatch-card-label { font-size: 11px; font-weight: bold; color: #333; text-align: center; line-height: 1.2; word-wrap: break-word; }

  /* detail drawings list inside each product panel */
  .item-drawings { margin-top: 8px; padding: 8px 10px; background: #fff; border: 1px dashed #c9ced6; border-radius: 4px; }
  .dd-head { font-size: 10px; font-weight: bold; letter-spacing: .6px; text-transform: uppercase; color: #666; margin-bottom: 6px; }
  .dd-chip { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 6px 0; padding: 3px 8px; border: 1px solid #d5d9e0;
             border-radius: 12px; font-size: 11px; color: #333; background: #f6f8fb; cursor: pointer; text-transform: none; font-weight: normal; }
  .dd-chip input { width: auto; height: auto; margin: 0; }
  /* design help center */
  .side-head h2 { display: flex; align-items: center; gap: 8px; }
  .help-btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 6px; border: 1px solid #c9ced6; border-radius: 13px;
              background: #fff; color: #3C5F90; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: none; width: auto; margin: 0; }
  .help-btn:hover { background: #eef3fa; border-color: #3C5F90; }
  #help-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1001; align-items: center; justify-content: center; }
  .help-content { max-width: 860px; height: 85vh; }
  .help-action { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin-right: 6px; width: auto; height: auto; }
  .help-action:hover { background: #f0f0f0; }
  #help-text { flex: 1; overflow: auto; margin: 0; padding: 18px 22px; font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
               line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: #222; background: #fff; border-radius: 0 0 8px 8px; }
  /* pictogram remove button */
  .swatch-row { display: flex; gap: 4px; width: 100%; }
  .swatch-row .swatch-btn { flex: 1; min-width: 0; }
  .swatch-clear { flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border: 1px solid #ccc; border-radius: 4px; background: #fff;
                  color: #c1272d; font-size: 18px; font-weight: bold; line-height: 1; cursor: pointer; align-items: center; justify-content: center; }
  .swatch-clear:hover { background: #fdecec; border-color: #c1272d; }

  /* QA checklist pages in the preview */
  .sheet.portrait { max-width: 850px; }
  .sheet-label { color: #ebba34; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-align: center; margin: 10px 0 18px; line-height: 1.4; }
  /* artwork images: toolbar above each proof page */
  .sheet-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 auto 6px; padding: 6px 10px; background: #2f2f2f;
                 border: 1px solid #444; border-radius: 6px; color: #ddd; font-size: 12px; cursor: pointer; line-height: 1.3; }
  .sheet-tools.active { border-color: #ebba34; box-shadow: 0 0 0 1px #ebba34; }
  .st-title { font-weight: bold; color: #fff; margin-right: 6px; }
  .st-btn { width: auto; height: auto; padding: 3px 9px; font-size: 12px; font-weight: bold; border: 1px solid #666; border-radius: 4px;
            background: #444; color: #fff; cursor: pointer; margin: 0; }
  .st-btn:hover { background: #ebba34; color: #000; border-color: #ebba34; }
  .st-img { display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px 2px 8px; background: #3a3a3a; border-radius: 4px; }
  .st-hint { color: #999; font-size: 11px; }
  .sheet.active { outline: 2px solid #ebba34; outline-offset: 2px; }
  .sheet image[data-art] { cursor: move; }
</style>
