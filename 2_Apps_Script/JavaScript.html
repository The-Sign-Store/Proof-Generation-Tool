      return pagesOut.map((rowsOnPage, pi) => {
          let o = svgHead(W, H, 8.5, 11);
          // header
          o += `<g id="QA_Header">` + IMG(X, 34, logoW, logoW * LOGO_AR, PROOF_ASSETS.logo) +
               T(XR, 52, 'QUALITY ASSURANCE CHECKLIST', 16, { anchor: 'end', bold: true, ls: 0.8 }) +
               T(XR, 68, `QA page ${pi + 1} / ${n}  \u00B7  proof package of ${proofTotal} page${proofTotal === 1 ? '' : 's'}`, 8.5, { anchor: 'end', fill: '#666666' }) +
               L(X, 84, XR, 84, INK, 1.2);
          let val = (v, x, yy, label) => v ? T(x, yy, v, 9.5, { bold: true }) : missingTag(x + tw('MISSING', 7, true) + 6, yy, 'MISSING', 7);
          if (pi === 0) {
              let col = [X, 330, 590], r1 = 104, r2 = 128, r3 = 152;
              [[col[0], r1, 'CUSTOMER', info.name], [col[1], r1, 'PROJECT', info.project], [col[2], r1, 'TICKET NO.', info.ticket],
               [col[0], r2, 'INSTALLATION LOCATION', info.location], [col[1], r2, 'SALESPERSON', info.sales], [col[2], r2, 'INV/EST #', info.inv],
               [col[0], r3, 'DESIGNER', info.designer], [col[1], r3, 'REVISION DATE', info.rev], [col[2], r3, 'QA DUE / SHIP DATE', '__________']].forEach(([x, yy, lab, v]) => {
                  o += T(x, yy - 9, lab, 6.5, { bold: true, fill: '#888888', ls: 0.8 });
                  let shown = v && v.length > 44 ? v.slice(0, 42) + '...' : v;
                  o += val(shown, x, yy + 3);
              });
              o += L(X, 166, XR, 166, '#CCCCCC', 0.6);
          } else {
              o += T(X, 104, [info.name || 'MISSING CUSTOMER', info.project, info.ticket ? 'Ticket ' + info.ticket : ''].filter(Boolean).join('  \u00B7  '), 9.5, { bold: true });
          }
          o += `</g><g id="QA_List">`;
          rowsOnPage.forEach(r => {
              let y = r.y;
              if (r.t === 'item') {
                  o += R(X, y + 2, XR - X, r.h - 4, INK) +
                       T(X + 8, y + 16, `${r.item.n}. ${r.item.name.toUpperCase()}${r.cont ? '  (CONTINUED)' : ''}`, 10.5, { bold: true, fill: '#FFFFFF' }) +
                       T(XR - 8, y + 16, `Proof page${r.item.range && r.item.range[0] !== r.item.range[1] ? 's' : ''} ${rangeText(r.item.range)}`, 8.5, { anchor: 'end', fill: '#FFFFFF' });
              } else if (r.t === 'sec') {
                  o += R(X, y + 3, XR - X, r.h - 4, '#E6E7E8') + T(X + 8, y + 14, String(r.text).toUpperCase(), 8, { bold: true, ls: 1 }) +
                       T(XR - 30, y + 14, 'OK / INIT.', 6.5, { anchor: 'middle', fill: '#777777', bold: true });
              } else if (r.t === 'spec' || r.t === 'check') {
                  o += R(X + 8, y + 5, 9, 9, '#FFFFFF', '#555555', 0.9);
                  if (r.t === 'spec') {
                      let it = r.it, warn = it.warn;
                      o += T(LBL_X, y + 13, it.label.toUpperCase(), 7.5, { bold: true, fill: '#777777' });
                      if (warn) {
                          let ww = Math.max.apply(null, r.lines.map(l => tw(l, 9.5, true))) + 6;
                          o += R(VAL_X - 2, y + 4, ww, (r.lines.length - 1) * 12 + 12, TAG_BG, '#D6A100', 0.6, ' stroke-dasharray="1.5,1"');
                      }
                      r.lines.forEach((l, i) => o += T(VAL_X + (warn ? 1 : 0), y + 13.5 + i * 12, l, 9.5, { bold: true, fill: warn ? TAG_TX : '#000000' }));
                      if (it.gradient) o += R(SW_X, y + 5, 30, 10, 'url(#fullcolor)', '#555555', 0.6);
                      else if (it.svg) o += R(SW_X, y + 3, 14, 14, it.picBg || '#FFFFFF', '#555555', 0.6) +
                          (() => { let vb = String(it.svg.viewBox || '0 0 216 216').split(/\s+/).map(Number), k = 12 / Math.max(vb[2], vb[3]);
                                   return `<g transform="translate(${SW_X + 1},${y + 4}) scale(${k.toFixed(4)})"><path d="${esc(it.svg.path)}" fill="${it.picFill || '#000000'}"/></g>`; })();
                      else if (it.hex && !warn) o += R(SW_X, y + 5, 30, 10, normHex(it.hex) === 'transparent' ? '#FFFFFF' : normHex(it.hex), '#555555', 0.6);
                  } else {
                      r.lines.forEach((l, i) => o += T(LBL_X, y + 13 + i * 11.5, l, 9, { fill: '#222222', bold: i === 0 && !r.item }));
                  }
                  o += L(INIT_X, y + r.h - 4, XR - 4, y + r.h - 4, '#999999', 0.6) + L(X, y + r.h, XR, y + r.h, '#EEEEEE', 0.5);
              } else if (r.t === 'signoff') {
                  let sy = y + 10;
                  o += R(X, sy, XR - X, 76, '#FAFAFA', INK, 0.9) +
                       T(X + 10, sy + 20, 'QA MANAGER', 9, { bold: true }) + L(X + 90, sy + 21, X + 330, sy + 21, '#555555', 0.6) +
                       T(X + 345, sy + 20, 'DATE', 9, { bold: true }) + L(X + 380, sy + 21, X + 480, sy + 21, '#555555', 0.6) +
                       R(X + 505, sy + 11, 10, 10, '#FFFFFF', '#555555', 0.9) + T(X + 521, sy + 20, 'PASS', 9, { bold: true }) +
                       R(X + 570, sy + 11, 10, 10, '#FFFFFF', '#555555', 0.9) + T(X + 586, sy + 20, 'FAIL - see notes', 9, { bold: true }) +
                       T(X + 10, sy + 44, 'NOTES', 9, { bold: true }) + L(X + 55, sy + 45, XR - 10, sy + 45, '#555555', 0.6) + L(X + 10, sy + 65, XR - 10, sy + 65, '#555555', 0.6);
              }
          });
          o += `</g><g id="QA_Footer">` + L(X, 1040, XR, 1040, '#CCCCCC', 0.6) +
               T(X, 1058, `${info.name || ''}${info.project ? ' \u00B7 ' + info.project : ''}`, 7.5, { fill: '#666666' }) +
               T(XR, 1058, `Checked against the proof package dated ${info.rev}  \u00B7  QA page ${pi + 1} / ${n}`, 7.5, { anchor: 'end', fill: '#666666' }) + `</g>`;
          return o + `</svg>`;
      });
  }

  // ---------- QA checklist as a spreadsheet (.csv) ----------
  function buildQACsv(pages, info) {
      let q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`, out = [];
      out.push(['Customer', info.name], ['Project', info.project], ['Ticket No.', info.ticket], ['Inv/Est #', info.inv], ['Revision Date', info.rev], []);
      out.push(['Item #', 'Product / Component', 'Proof Pages', 'Section', 'Spec', 'Value', 'Status', 'Checked (Y/N)', 'Initials', 'Notes']);
      qaData(pages, coverOn() ? 1 : 0).forEach(item => {
          item.sections.forEach(sec => sec.items.forEach(it =>
              out.push([item.n, item.name, rangeText(item.range), sec.title, it.label, it.val, it.warn ? it.warnLabel : 'OK', '', '', ''])));
          item.drawings.forEach(d => out.push([item.n, item.name, rangeText(item.range), 'Detail drawing', 'Built per detail', d, 'OK', '', '', '']));
      });
      qaFinalChecks().forEach(c => out.push(['', 'FINAL CHECKS', '', '', c, '', '', '', '', '']));
      return '\uFEFF' + out.map(r => r.map(q).join(',')).join('\r\n');
  }

  // =====================================================================
  //  ARTWORK IMAGES ON PROOF PAGES  (screenshots / JPEG / PNG)
  //  Stored per item page ("iid:n"), in memory for this session.
  // =====================================================================
  let pageArt = {}, activeArtKey = null;
  const ART_MAX_PX = 2400;   // longest side kept; larger images are scaled down before embedding
  function artKey(p) { return `${p.item.iid}:${p.n}`; }

  // open space on the art board: above the spec table, clear of the detail drawings
  function artRegion(page, lay) {
      const AB = PG.AB, pad = 16;
      let tableTop = AB.y + AB.h - 30;
      if (lay) { let bs = 12 * Math.max(lay.s, 0.8); tableTop = AB.y + AB.h - 30 - lay.h - bs * 1.9; }
      let left = AB.x + pad, top = AB.y + pad, right = AB.x + AB.w - pad;
      let list = page.drawings || [], ncol = detailColumns(list.length);
      if (!ncol) return { x: left, y: top, w: right - left, h: tableTop - pad - top };
      let colH = Math.min(list.length, 3) * (DD.T + DD.CAP) + (Math.min(list.length, 3) - 1) * DD.G;
      let ddTop = AB.y + AB.h - 18 - colH - 14, ddLeft = AB.x + AB.w - 12 - ncol * DD.T - (ncol - 1) * DD.G;
      let a = { x: left, y: top, w: right - left, h: Math.min(tableTop, ddTop) - pad - top };          // full width, above both
      let b = { x: left, y: top, w: ddLeft - pad - left, h: tableTop - pad - top };                    // left of the details
      return a.w * a.h >= b.w * b.h ? a : b;
  }

  function artPlacement(region, n, i, a) {
      const gap = 16, cw = (region.w - gap * (n - 1)) / n;
      let k = Math.min(cw / a.w, region.h / a.h), w = a.w * k * a.scale, h = a.h * k * a.scale;
      let cx = region.x + i * (cw + gap) + cw / 2 + a.dx, cy = region.y + region.h / 2 + a.dy;
      return { x: cx - w / 2, y: cy - h / 2, w, h };
  }

  function drawArt(page, region) {
      let arts = pageArt[artKey(page)] || [];
      if (!arts.length || region.w < 40 || region.h < 40) return '';
      let o = `<g id="Artwork" clip-path="url(#abclip)">`;
      arts.forEach((a, i) => {
          let r = artPlacement(region, arts.length, i, a);
          o += `<g id="Artwork_${i + 1}"><image data-art="${artKey(page)}|${i}" x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" ` +
               `height="${r.h.toFixed(2)}" preserveAspectRatio="none" xlink:href="${a.src}"/></g>`;
      });
      return o + `</g>`;
  }

  // read a file -> downscaled JPEG data URI (white behind transparent PNG areas)
  function loadArtFile(file) {
      return new Promise((resolve, reject) => {
          let fr = new FileReader();
          fr.onload = () => {
              let img = new Image();
              img.onload = () => {
                  let k = Math.min(1, ART_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
                  let c = document.createElement('canvas');
                  c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
                  let ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
                  resolve({ src: c.toDataURL('image/jpeg', 0.9), w: c.width, h: c.height, scale: 1, dx: 0, dy: 0, name: file.name || 'pasted image' });
              };
              img.onerror = () => reject(new Error('Not an image: ' + (file.name || 'pasted item')));
              img.src = fr.result;
          };
          fr.onerror = () => reject(fr.error);
          fr.readAsDataURL(file);
      });
  }

  async function addArtFiles(key, files) {
      files = [].slice.call(files || []).filter(f => /^image\/(jpe?g|png|gif|bmp|webp)$/i.test(f.type) || /\.(jpe?g|png)$/i.test(f.name || ''));
      if (!key || !files.length) return;
      for (let f of files) {
          try { let a = await loadArtFile(f); (pageArt[key] = pageArt[key] || []).push(a); }
          catch (e) { alert(e.message); }
      }
      activeArtKey = key;
      renderPreview();
  }
  function pickArt(key) {
      let inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/jpeg,image/png'; inp.multiple = true;
      inp.onchange = () => addArtFiles(key, inp.files);
      inp.click();
  }
  function setActiveArt(key) {
      activeArtKey = key;
      document.querySelectorAll('.sheet-tools').forEach(el => el.classList.toggle('active', el.dataset.key === key));
      document.querySelectorAll('.sheet[data-key]').forEach(el => el.classList.toggle('active', el.dataset.key === key));
  }
  function artScale(key, i, f) { let a = (pageArt[key] || [])[i]; if (a) { a.scale = Math.min(4, Math.max(0.1, a.scale * f)); renderPreview(); } }
  function artFit(key, i) { let a = (pageArt[key] || [])[i]; if (a) { a.scale = 1; a.dx = 0; a.dy = 0; renderPreview(); } }
  function artRemove(key, i) { let l = pageArt[key] || []; l.splice(i, 1); if (!l.length) delete pageArt[key]; renderPreview(); }

  function artToolbar(p, pageNo) {
      let key = artKey(p), arts = pageArt[key] || [];
      let b = (fn, label, title) => `<button type="button" class="st-btn" title="${title}" onclick="event.stopPropagation(); ${fn}">${label}</button>`;
      return `<div class="sheet-tools${key === activeArtKey ? ' active' : ''}" data-key="${key}" onclick="setActiveArt('${key}')">` +
             `<span class="st-title">Page ${pageNo} &middot; ${esc(p.item.name)} ${p.n}/${p.total}</span>` +
             b(`pickArt('${key}')`, '+ Add image', 'Add JPEG / PNG artwork or screenshots to this page') +
             (arts.length ? '' : `<span class="st-hint">or drop a file here / click this bar and press Ctrl+V</span>`) +
             arts.map((a, j) => `<span class="st-img" title="${esc(a.name)}">Image ${j + 1}` +
                 b(`artScale('${key}', ${j}, 0.9)`, '&minus;', 'Smaller') + b(`artScale('${key}', ${j}, 1.1)`, '+', 'Larger') +
                 b(`artFit('${key}', ${j})`, 'Fit', 'Reset size and position') + b(`artRemove('${key}', ${j})`, '&times;', 'Remove this image') + `</span>`).join('') +
             (arts.length ? `<span class="st-hint">drag an image to move it</span>` : '') + `</div>`;
  }

  // paste a screenshot (Ctrl+V) onto the active page, or the first page
  document.addEventListener('paste', e => {
      if (step === 'select' || !e.clipboardData) return;
      let files = [].slice.call(e.clipboardData.items || []).filter(it => it.kind === 'file' && /^image\//.test(it.type)).map(it => it.getAsFile());
      if (!files.length) return;                       // plain text pastes into fields as usual
      e.preventDefault();
      let first = document.querySelector('.sheet-tools');
      addArtFiles(activeArtKey || (first && first.dataset.key), files);
  });
  // drop files on a page (or its toolbar)
  document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('#preview-area')) e.preventDefault(); });
  document.addEventListener('drop', e => {
      let host = e.target.closest && e.target.closest('[data-key]');
      if (!e.target.closest || !e.target.closest('#preview-area')) return;
      e.preventDefault();
      if (host && e.dataTransfer && e.dataTransfer.files.length) addArtFiles(host.dataset.key, e.dataTransfer.files);
  });
  // drag an image on the preview to move it
  document.addEventListener('pointerdown', e => {
      let el = e.target.closest && e.target.closest('image[data-art]');
      if (!el) return;
      e.preventDefault();
      let [key, idx] = el.getAttribute('data-art').split('|'), a = (pageArt[key] || [])[+idx];
      if (!a) return;
      setActiveArt(key);
      let svg = el.ownerSVGElement, m = svg.getScreenCTM().inverse();
      let toSvg = (cx, cy) => { let pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(m); };
      let start = toSvg(e.clientX, e.clientY), x0 = +el.getAttribute('x'), y0 = +el.getAttribute('y'), ddx = 0, ddy = 0;
      let move = ev => { let pt = toSvg(ev.clientX, ev.clientY); ddx = pt.x - start.x; ddy = pt.y - start.y;
                         el.setAttribute('x', (x0 + ddx).toFixed(2)); el.setAttribute('y', (y0 + ddy).toFixed(2)); };
      let up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
                       a.dx += ddx; a.dy += ddy; renderPreview(); };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
  });

  // =====================================================================
  //  PREVIEW
  // =====================================================================
  function schedulePreview() { clearTimeout(renderTimer); renderTimer = setTimeout(renderPreview, 60); }

  function renderPreview() {
      if (step === 'select') return;
      try {
          let pages = packagePages(), info = getCustomerInfo();
          let strip = svg => svg.replace(/^<\?xml[^>]*>\s*/, '');
          let off = coverOn() && pages.length ? 1 : 0, total = pages.length + off, html = '';
          if (off) html += `<div class="sheet">${strip(buildCoverSVG(pages, info, total))}</div>`;
          html += pages.map((p, i) => artToolbar(p, i + 1 + off) +
              `<div class="sheet${artKey(p) === activeArtKey ? ' active' : ''}" data-key="${artKey(p)}">${strip(buildSheetSVG(p, i + 1 + off, total, info))}</div>`).join('');
          if (qaOn() && pages.length) {
              html += `<div class="sheet-label">QA CHECKLIST \u00B7 exported in the package's QA_Checklist folder (not for the customer)</div>`;
              html += buildQAPages(pages, info, total).map(svg => `<div class="sheet portrait">${strip(svg)}</div>`).join('');
          }
          document.getElementById('sheets').innerHTML = html || '<div style="color:#aaa;padding:40px;">Nothing to preview yet.</div>';
          document.getElementById('page-count').innerText = `${total} page${total === 1 ? '' : 's'}${qaOn() && pages.length ? ' + QA' : ''}`;
          updateCustomerTags(info);
      } catch (e) { console.error('Preview error:', e); }
  }

  function updateCustomerTags(info) {
      let req = { 'cf-name': info.name, 'cf-project': info.project, 'cf-location': info.location, 'cf-sales': info.sales, 'cf-inv': info.inv, 'cf-ticket': info.ticket,
                  'cf-designer': info.designer, 'cf-orig': info.orig, 'cf-path': info.path };
      Object.keys(req).forEach(id => { let g = document.getElementById(id); if (g) g.parentElement.classList.toggle('missing', !req[id]); });
  }

  // =====================================================================
  //  EXPORT: zip of SVG (editable) + PNG (300 ppi) per page
  // =====================================================================
  function svgToPngBlob(svg, pw, ph) {
      pw = pw || 3300; ph = ph || 2550;   // 300 ppi
      return new Promise((resolve, reject) => {
          let img = new Image();
          let url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
          img.onload = () => {
              let c = document.createElement('canvas'); c.width = pw; c.height = ph;
              let ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
              ctx.drawImage(img, 0, 0, c.width, c.height);
              URL.revokeObjectURL(url);
              c.toBlob(b => b ? resolve(b) : reject(new Error('PNG failed')), 'image/png');
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not render SVG')); };
          img.src = url;
      });
  }

  function saveBlob(blob, name) {
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function generatePackage() {
      let info = getCustomerInfo();
      let missing = ['name', 'project', 'location', 'sales', 'inv', 'ticket', 'designer', 'orig', 'path'].filter(k => !info[k]);
      if (missing.length && !confirm(`${missing.length} customer field(s) are empty and will print as yellow MISSING tags.\nGenerate anyway?`)) return;
      let btn = document.getElementById('generate-btn'), label = btn.innerHTML;
      let pages = packagePages();
      let base = slug(info.name || 'proof');
      let zip = (typeof JSZip !== 'undefined') ? new JSZip() : null;
      let off = coverOn() && pages.length ? 1 : 0, total = pages.length + off;
      // every file in order: cover, proof pages, then the QA checklist (own folder)
      let jobs = [];
      if (off) jobs.push({ name: 'p01_cover', svg: () => buildCoverSVG(pages, info, total) });
      pages.forEach((p, i) => jobs.push({ name: `p${String(i + 1 + off).padStart(2, '0')}_${slug(p.item.name)}_specs_${p.n}`,
                                          svg: () => buildSheetSVG(p, i + 1 + off, total, info) }));
      if (qaOn() && pages.length) buildQAPages(pages, info, total).forEach((svg, i) =>
          jobs.push({ name: `QA_Checklist/qa${String(i + 1).padStart(2, '0')}_checklist`, svg: () => svg, pw: 2550, ph: 3300 }));
      let save = async (name, blob) => {
          if (zip) zip.file(name, blob);
          else { saveBlob(blob, name.split('/').pop()); await new Promise(r => setTimeout(r, 400)); }
      };
      try {
          for (let i = 0; i < jobs.length; i++) {
              btn.innerHTML = `Generating ${i + 1} of ${jobs.length}...`;
              let j = jobs[i], svg = j.svg();
              let png = await svgToPngBlob(svg, j.pw, j.ph);
              await save(`${j.name}.svg`, new Blob([svg], { type: 'image/svg+xml' }));
              await save(`${j.name}.png`, png);
          }
          if (qaOn() && pages.length) await save('QA_Checklist/qa_checklist.csv', new Blob([buildQACsv(pages, info)], { type: 'text/csv' }));
          if (zip) {
              btn.innerHTML = 'Zipping...';
              saveBlob(await zip.generateAsync({ type: 'blob' }), `${base}_proof_package.zip`);
          }
      } catch (e) {
          alert('Export failed: ' + e.message);
      } finally {
          btn.innerHTML = label;
      }
  }
</script>
