                  c.toBlob(j => j.arrayBuffer().then(buf => { b.jpeg = { bytes: new Uint8Array(buf), w: c.width, h: c.height }; resolve(b); }), 'image/jpeg', 0.9);
              }, 'image/png');
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not render SVG')); };
          img.src = url;
      });
  }

  // one page as a single SVG file, built exactly like the package export (same name it has inside the zip)
  function downloadPageSVG(kind, i) {
      let pages = packagePages(), info = getCustomerInfo(), base = exportBase(info);
      let off = coverOn() && pages.length ? 1 : 0, total = pages.length + off, pad = n => String(n).padStart(2, '0');
      let svg, file;
      try {
          EXPORTING = true;
          if (kind === 'cover') { svg = buildCoverSVG(pages, info, total); file = `${base} - p01`; }
          else if (kind === 'qa') { svg = buildQAPages(pages, info, total)[i]; file = `${base} - qa${pad(i + 1)}`; }
          else { svg = buildSheetSVG(pages[i], i + 1 + off, total, info); file = `${base} - p${pad(i + 1 + off)}`; }
      } finally { EXPORTING = false; }
      if (!svg) return;
      saveBlob(new Blob([svg], { type: 'image/svg+xml' }), file + '.svg');
      toast(`Downloaded ${file}.svg`);
  }

  function saveBlob(blob, name) {
      let a = document.createElement('a');

  // =====================================================================
  //  PROOF LIBRARY: save the whole package to Drive (ProofLibrary.gs) and reopen it to edit; every save is a new revision
  // =====================================================================
  const STATE_FORMAT = 1;
  let currentProof = null;      // { proofId, rev, savedAt, label } once saved or opened
  let restoring = null;         // while a saved proof is rebuilt: { item, parts, taken: {di: n} }
  let libraryList = [];

  // every element of a section whose id carries the section's uid, keyed with the uid swapped for "~"
  function captureValues(root, uid) {
      let out = {};
      if (!root) return out;
      root.querySelectorAll('[id]').forEach(el => {
          if (el.id.indexOf(`${uid}_`) === -1) return;
          let k = el.id.split(`${uid}_`).join('~_'), v = {};
          if (el.type === 'checkbox' || el.type === 'radio') v.c = el.checked;
          else if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) v.v = el.value;
          if (el.style && el.style.display) v.d = el.style.display;
          if (/^mtxt-/.test(el.id)) v.t = el.innerText;
          if (/^mcol-/.test(el.id)) { v.bg = el.style.background; v.h = el.innerHTML; }
          if (el.classList && el.classList.contains('cc-approx')) v.a = 1;
          if (Object.keys(v).length) out[k] = v;
      });
      return out;
  }
  function applyValues(uid, values) {
      Object.keys(values || {}).forEach(k => {
          let el = document.getElementById(k.split('~_').join(`${uid}_`)), v = values[k]; if (!el) return;
          if ('c' in v) el.checked = v.c;
          if ('v' in v) el.value = v.v;
          if ('d' in v) el.style.display = v.d;
          if ('t' in v) el.innerText = v.t;
          if ('bg' in v) el.style.background = v.bg;
          if ('h' in v) el.innerHTML = v.h;
          if (v.a) el.classList.add('cc-approx');
      });
  }
  function imgHash(src) {                                     // FNV-1a over the data URL: same image = same file in Drive
      let h = 0x811c9dc5;
      for (let i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
      return h.toString(16).padStart(8, '0') + src.length.toString(16);
  }

  function captureState() {
      let customComps = {};
      Object.keys(appData.components).forEach(id => { if (appData.components[id].custom) customComps[id] = JSON.parse(JSON.stringify(appData.components[id])); });
      let customer = {};
      document.querySelectorAll('#customer-panel [id]').forEach(el => {
          if (el.id === 'cf-rev') return;
          if (el.type === 'checkbox') customer[el.id] = { c: el.checked };
          else if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) customer[el.id] = { v: el.value };
      });
      let art = {}, images = {};
      Object.keys(pageArt).forEach(key => {
          art[key] = (pageArt[key] || []).map(a => {
              let h = a.hash || (a.hash = imgHash(a.src));
              images[h] = a.src;
              return { img: h, w: a.w, h: a.h, scale: a.scale, dx: a.dx, dy: a.dy, name: a.name };
          });
      });
      let state = {
          format: STATE_FORMAT, app: APP_VERSION, savedAt: new Date().toISOString(),
          seq: { itemSeq, customSeq, customCompSeq, blankSeq, lineSeq },
          customProducts: JSON.parse(JSON.stringify(customProducts)), customComps,
          items: pkgItems.map(it => ({ iid: it.iid, key: it.key, kind: it.kind, name: it.name, defs: it.defs.map(d => Object.assign({}, d)), blanks: it.blanks.map(b => Object.assign({}, b)) })),
          parts: allParts.map(p => ({ iid: p.iid, di: p.di, custom: p.custom, notesOn: p.notesOn, notes: p.notes, newPage: p.newPage, enabled: p.enabled,
                                      letterLines: p.letterLines.map(l => Object.assign({}, l)), drawPick: p.drawPick.slice(),
                                      colorLines: JSON.parse(JSON.stringify(p.colorLines)), colorSeq: p.colorSeq,
                                      values: captureValues(document.getElementById(`part-${p.uid}`), p.uid) })),
          excludedDrawings: Object.assign({}, excludedDrawings), customer, art, measures: JSON.parse(JSON.stringify(pageMeasures))
      };
      return { state, images };
  }

  // called by addPart while restoring: give the new section its saved lists before its fields are drawn
  function takeSavedPart(part) {
      let n = restoring.taken[part.di] || 0;
      restoring.taken[part.di] = n + 1;
      let sp = restoring.parts.filter(p => p.di === part.di)[n];
      if (!sp) return;
      part.colorLines = JSON.parse(JSON.stringify(sp.colorLines || {})); part.colorSeq = sp.colorSeq || 0;
      part.letterLines = (sp.letterLines || []).map(l => Object.assign({}, l));
      part.drawPick = (sp.drawPick || []).slice();
      part._saved = sp;
  }

  function artFromSrc(src, saved) {
      return new Promise(resolve => {
          let img = new Image();
          img.onload = () => {
              let c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
              c.getContext('2d').drawImage(img, 0, 0);
              resolve(Object.assign({ src, canvas: c, hash: saved.img }, { w: saved.w || c.width, h: saved.h || c.height, scale: saved.scale || 1, dx: saved.dx || 0, dy: saved.dy || 0, name: saved.name || 'image' }));
          };
          img.onerror = () => resolve(null);
          img.src = src;
      });
  }

  function resetPackage() {
      document.getElementById('items').innerHTML = '';
      pkgItems = []; allParts = []; selection = [];
      pageArt = {}; pageMeasures = {}; excludedDrawings = {}; activeArtKey = null; measureKey = null;
      Object.keys(appData.components).forEach(id => { if (appData.components[id].custom) delete appData.components[id]; });
      customProducts = {};
      currentProof = null;
  }

  async function restoreState(st, images) {
      if (!st || st.format !== STATE_FORMAT) throw new Error('This saved proof was made by a newer version of the app.');
      resetPackage();
      customProducts = JSON.parse(JSON.stringify(st.customProducts || {}));
      Object.keys(st.customComps || {}).forEach(id => { appData.components[id] = JSON.parse(JSON.stringify(st.customComps[id])); });
      customCompSeq = st.seq.customCompSeq || 0; customSeq = st.seq.customSeq || 0;
      let missing = [];
      st.items.forEach(si => {
          if (si.kind !== 'custom' && !si.defs.some(d => appData.components[d.component])) { missing.push(si.name); return; }
          itemSeq = Number(String(si.iid).replace(/\D/g, '')) - 1;                  // same item ids, so page images / measures line up
          restoring = { item: si, parts: st.parts.filter(p => p.iid === si.iid), taken: {} };
          let it;
          try {
              it = createItem(si.key);
              si.defs.forEach((d, di) => {
                  if (d.removed || !appData.components[d.component]) return;
                  let n = restoring.parts.filter(p => p.di === di).length;
                  for (let k = 1; k < n; k++) addPart(it, di);
              });
          } finally { restoring = null; }
          it.blanks = (si.blanks || []).map(b => Object.assign({}, b)); renderBlanks(it);
          selection.push(si.key);
      });
      itemSeq = Math.max(itemSeq, st.seq.itemSeq || 0); blankSeq = st.seq.blankSeq || blankSeq; lineSeq = Math.max(lineSeq, st.seq.lineSeq || 0);
      allParts.forEach(part => {
          let sp = part._saved; delete part._saved; if (!sp) return;
          applyValues(part.uid, sp.values);
          part.custom = sp.custom || ''; part.notesOn = !!sp.notesOn; part.notes = sp.notes || ''; part.newPage = !!sp.newPage; part.enabled = sp.enabled !== false;
          let t = document.getElementById(`ptitle-${part.uid}`); if (t && part.custom) t.value = part.custom;
          let nOn = document.getElementById(`pnote-on-${part.uid}`), nTx = document.getElementById(`pnote-${part.uid}`);
          if (nOn) nOn.checked = part.notesOn; if (nTx) { nTx.value = part.notes; nTx.style.display = part.notesOn ? 'block' : 'none'; }
          let np = document.getElementById(`pnew-${part.uid}`); if (np) np.checked = part.newPage;
          let inc = document.getElementById(`pinc-${part.uid}`); if (inc) inc.checked = part.enabled;
          let body = document.getElementById(`pbody-${part.uid}`); if (body) body.style.display = part.enabled ? 'block' : 'none';
          renderLetterLines(part);
      });
      excludedDrawings = Object.assign({}, st.excludedDrawings || {});
      Object.keys(st.customer || {}).forEach(id => {
          let el = document.getElementById(id), v = st.customer[id]; if (!el) return;
          if ('c' in v) el.checked = v.c; if ('v' in v) el.value = v.v;
      });
      document.getElementById('cf-sub-group').style.display = document.getElementById('cf-has-sub').checked ? 'flex' : 'none';
      pageMeasures = JSON.parse(JSON.stringify(st.measures || {}));
      for (let key of Object.keys(st.art || {})) {
          let list = [];
          for (let a of st.art[key]) { let src = images[a.img]; if (!src) continue; let ok = await artFromSrc(src, a); if (ok) list.push(ok); }
          if (list.length) pageArt[key] = list;
      }
      renderCustomCards(); updateSelectionBar();
      refreshAll();
      return missing;
  }

  // ---------- save ----------
  function proofLabel() {
      let i = getCustomerInfo();
      return [i.ticket, i.custName, i.project].filter(Boolean).join(' - ') || 'Untitled proof';
  }
  function openSaveDialog() {
      if (!pkgItems.length) { toast('Add at least one product before saving.'); return; }
      document.getElementById('save-title').innerText = proofLabel();
      document.getElementById('save-where').innerText = currentProof
          ? `Saves Rev ${currentProof.rev + 1} of this proof. Rev ${currentProof.rev} and earlier stay in the library.`
          : 'Saves Rev 1 to the shared Proof Library.';
      document.getElementById('save-new-row').style.display = currentProof ? 'flex' : 'none';
      document.getElementById('save-as-new').checked = false;
      document.getElementById('save-note').value = '';
      document.getElementById('save-modal').style.display = 'flex';
      document.getElementById('save-note').focus();
  }
  function closeSaveDialog() { document.getElementById('save-modal').style.display = 'none'; }
  function saveProofNow() {
      let asNew = document.getElementById('save-as-new').checked, note = document.getElementById('save-note').value.trim();
      let cap = captureState(), info = getCustomerInfo();
      let images = Object.keys(cap.images).map(h => ({ hash: h, data: cap.images[h].replace(/^data:[^,]*,/, ''), mime: 'image/jpeg' }));
      let meta = { ticket: info.ticket, customer: info.name, sub: info.sub, project: info.project, designer: info.designer,
                   products: pkgItems.map(i => i.name).join(', '), note, appVersion: APP_VERSION };
      let btn = document.getElementById('save-go'); btn.disabled = true; btn.innerText = 'Saving…';
      google.script.run
          .withSuccessHandler(r => {
              btn.disabled = false; btn.innerText = 'Save';
              currentProof = { proofId: r.proofId, rev: r.rev, savedAt: r.savedAt, label: proofLabel() };
              closeSaveDialog(); updateProofStatus();
              toast(`Saved Rev ${r.rev}: ${currentProof.label}`);
          })
          .withFailureHandler(e => { btn.disabled = false; btn.innerText = 'Save'; alert('Could not save the proof: ' + (e && e.message || e)); })
          .saveProof({ proofId: asNew || !currentProof ? null : currentProof.proofId, meta, state: JSON.stringify(cap.state), images });
  }
  function updateProofStatus() {
      let el = document.getElementById('proof-status'); if (!el) return;
      el.innerHTML = currentProof ? `<span class="ps-dot"></span>Rev ${currentProof.rev} <span class="ps-time">saved ${esc(currentProof.savedAt)}</span>` : '';
      el.title = currentProof ? `${currentProof.label} (${currentProof.proofId})` : '';
      el.style.display = currentProof ? 'inline-flex' : 'none';
  }

  // ---------- library ----------
  function openLibrary() {
      document.getElementById('library-modal').style.display = 'flex';
      document.getElementById('lib-search').value = '';
      document.getElementById('lib-list').innerHTML = '<div class="lib-empty">Loading saved proofs…</div>';
      google.script.run
          .withSuccessHandler(list => { libraryList = list || []; renderLibrary(); document.getElementById('lib-search').focus(); })
          .withFailureHandler(e => { document.getElementById('lib-list').innerHTML = `<div class="lib-empty">Could not load the Proof Library: ${esc(e && e.message || e)}</div>`; })
          .listProofs();
  }
  function closeLibrary() { document.getElementById('library-modal').style.display = 'none'; }
  function renderLibrary() {
      let q = document.getElementById('lib-search').value.trim().toLowerCase();
      let list = libraryList.filter(p => !q || [p.ticket, p.customer, p.sub, p.project, p.designer, p.products].join(' ').toLowerCase().indexOf(q) !== -1);
      let box = document.getElementById('lib-list');
      if (!libraryList.length) { box.innerHTML = '<div class="lib-empty">No saved proofs yet. Build a package, then use Save in the top bar.</div>'; return; }
      if (!list.length) { box.innerHTML = '<div class="lib-empty">No saved proofs match your search.</div>'; return; }
      box.innerHTML = list.map((p, i) => `<div class="lib-row">
            <div class="lib-main">
              <div class="lib-title">${esc([p.customer + (p.sub ? ' - ' + p.sub : ''), p.project].filter(Boolean).join(' — ') || 'Untitled proof')}</div>
              <div class="lib-meta">${p.ticket ? `<span class="chip">Ticket ${esc(p.ticket)}</span>` : ''}${p.designer ? `<span class="chip">${esc(p.designer)}</span>` : ''}<span class="lib-products">${esc(p.products)}</span></div>
            </div>
            <div class="lib-side">
              <select class="lib-rev" id="lib-rev-${i}" title="Revision to open">${p.revs.map(r => `<option value="${r.rev}">Rev ${r.rev} – ${esc(r.savedAt)}${r.note ? ' – ' + esc(r.note) : ''}</option>`).join('')}</select>
              <button type="button" class="btn-filled" onclick="openSavedProof('${esc(p.proofId)}', document.getElementById('lib-rev-${i}').value)">Open</button>
            </div>
          </div>`).join('');
  }
  function openSavedProof(proofId, rev) {
      if (pkgItems.length && !confirm('Open this saved proof? Anything not saved in the current package will be lost.')) return;
      document.getElementById('lib-list').innerHTML = '<div class="lib-empty">Opening…</div>';
      google.script.run
          .withSuccessHandler(async r => {
              try {
                  let missing = await restoreState(JSON.parse(r.state), r.images || {});
                  let latest = (libraryList.find(p => p.proofId === r.proofId) || {}).latest || r.rev;
                  currentProof = { proofId: r.proofId, rev: latest, savedAt: r.savedAt, label: proofLabel() };
                  closeLibrary(); updateProofStatus(); showStep('specs');
                  toast(`Opened Rev ${r.rev}: ${currentProof.label}` + (r.rev < latest ? ` (saving makes Rev ${latest + 1})` : ''));
                  if (missing.length) alert('These items are no longer in the Google Sheet and were left out: ' + missing.join(', '));
              } catch (e) { console.error(e); alert('Could not open this proof: ' + e.message); renderLibrary(); }
          })
          .withFailureHandler(e => { alert('Could not open this proof: ' + (e && e.message || e)); renderLibrary(); })
          .loadProof(proofId, Number(rev) || 0);
  }
  document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('swatch-modal').style.display === 'flex') { closeModal(); return; }
      if (document.getElementById('save-modal').style.display === 'flex') closeSaveDialog();
      if (document.getElementById('library-modal').style.display === 'flex') closeLibrary();
  });
  function newPackage() {
      if (pkgItems.length && !confirm('Start a new package? Anything not saved in the current package will be lost.')) return;
      resetPackage();
      document.querySelectorAll('#customer-panel input, #customer-panel textarea').forEach(el => { if (el.id === 'cf-rev') return; if (el.type === 'checkbox') el.checked = false; else el.value = ''; });
      document.getElementById('cf-sub-group').style.display = 'none';
      renderCustomCards(); updateSelectionBar(); updateProofStatus(); showStep('select');
  }

  function toggleSubCustomer() {
      let on = document.getElementById('cf-has-sub').checked;
      document.getElementById('cf-sub-group').style.display = on ? 'flex' : 'none';
      if (on) document.getElementById('cf-sub').focus();
      schedulePreview();
  }

  // File names: "Ticket - Customer - [Sub-Customer -] Project" (same as the CorelDRAW macro), Windows-safe
  function exportBase(info) {
      let clean = v => String(v == null ? '' : v).replace(/[\\\/:*?"<>|\t\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '');
      let b = [info.ticket, info.name, info.sub, info.project].map(clean).filter(x => x).join(' - ') || 'Proof Package';
      // keep it short enough for Windows paths (the name repeats in the zip's folder and in each file inside it)
      if (b.length > 80) { b = b.slice(0, 80); let cut = b.lastIndexOf(' '); if (cut > 40) b = b.slice(0, cut); b = b.replace(/[^A-Za-z0-9)\]]+$/, ''); }
      return b;
  }

  // package_info.txt: plain key=value lines read by the CorelDRAW ImportProofPackage macro
  function packageInfoText(info, total, pageNames) {
      let clean = v => String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').trim();
      return [['Ticket', info.ticket], ['Customer', info.name], ['SubCustomer', info.sub], ['Project', info.project], ['Invoice', info.inv],
              ['Salesperson', info.sales], ['Designer', info.designer], ['Location', info.location],
              ['OriginalDate', info.orig], ['RevisionDate', info.rev], ['FileLocation', info.path], ['Pages', total],
              ['FileBase', exportBase(info)]].concat(pageNames || [])
          .map(([k, v]) => k + '=' + clean(v)).join('\r\n') + '\r\n';
  }

  async function generatePackage() {
      let info = getCustomerInfo();
      let missing = (info.hasSub && !info.sub ? ['sub'] : []).concat(['name', 'project', 'location', 'sales', 'inv', 'ticket', 'designer', 'orig', 'path'].filter(k => !info[k]));
      if (missing.length && !confirm(`${missing.length} customer field(s) are empty and will print as yellow MISSING tags.\nGenerate anyway?`)) return;
      let btn = document.getElementById('generate-btn'), label = btn.innerHTML;
      let pages = packagePages();
      let base = exportBase(info), pageNames = [];
      let zip = (typeof JSZip !== 'undefined') ? new JSZip() : null;
      // Ask where to save BEFORE generating (the browser only allows the Save As window right after the click).
      // Chrome / Edge only; inside the Apps Script frame it is often blocked, then the normal download is used.
      let fileHandle = null;
      if (zip && window.showSaveFilePicker) {
          try {
              fileHandle = await window.showSaveFilePicker({ suggestedName: `${base}.zip`,
                  types: [{ description: 'Proof package (.zip)', accept: { 'application/zip': ['.zip'] } }] });
          } catch (e) {
              if (e && e.name === 'AbortError') return;   // user pressed Cancel
              fileHandle = null;                           // blocked here: fall back to a normal download
          }
      }
      let off = coverOn() && pages.length ? 1 : 0, total = pages.length + off;
      // every file in order: cover, proof pages, then the QA checklist.
      // Zip layout:  SVG/  PNG/  QA_Checklist/SVG/  QA_Checklist/PNG/  QA_Checklist/qa_checklist.csv
      let jobs = [];
      // names: "<Ticket - Customer - Project> - p01" ... and "- qa01" ... (pageNames go to package_info.txt for CorelDRAW)
      let pad = n => String(n).padStart(2, '0');
      if (off) { jobs.push({ dir: '', file: `${base} - p01`, svg: () => buildCoverSVG(pages, info, total) }); pageNames.push(['Page01', 'COVER']); }
      pages.forEach((p, i) => {
          jobs.push({ dir: '', file: `${base} - p${pad(i + 1 + off)}`, svg: () => buildSheetSVG(p, i + 1 + off, total, info) });
          pageNames.push([`Page${pad(i + 1 + off)}`, `${p.item.name.toUpperCase()}${p.blank ? ' ' + p.title.toUpperCase() : ''} ${p.n}/${p.total}`]);
      });
      if (qaOn() && pages.length) {
          let qa = buildQAPages(pages, info, total);
          qa.forEach((svg, i) => {
              jobs.push({ dir: 'QA_Checklist/', file: `${base} - qa${pad(i + 1)}`, svg: () => svg, pw: 2550, ph: 3300 });
              pageNames.push([`QA${pad(i + 1)}`, `QA CHECKLIST ${i + 1}/${qa.length}`]);
          });
      }
      let save = async (name, blob) => {
          if (zip) zip.file(name, blob);
          else { saveBlob(blob, name.split('/').pop()); await new Promise(r => setTimeout(r, 400)); }
      };
      try {
          EXPORTING = true;
          let qaJpegs = [];
          for (let i = 0; i < jobs.length; i++) {
              btn.innerHTML = `Generating ${i + 1} of ${jobs.length}...`;
              let j = jobs[i], svg = j.svg();
              svgToPngBlob.wantJpeg = j.dir === 'QA_Checklist/';
              let png = await svgToPngBlob(svg, j.pw, j.ph);
              svgToPngBlob.wantJpeg = false;
              if (png.jpeg) qaJpegs.push(png.jpeg);
              await save(`${j.dir}SVG/${j.file}.svg`, new Blob([svg], { type: 'image/svg+xml' }));
              await save(`${j.dir}PNG/${j.file}.png`, png);
          }
          if (qaJpegs.length) await save(`QA_Checklist/PRINT - ${base} - QA checklist.pdf`, jpegPagesToPdf(qaJpegs, `${base} - QA checklist`));
          if (qaOn() && pages.length) await save(`QA_Checklist/${base} - QA checklist.csv`, new Blob([buildQACsv(pages, info)], { type: 'text/csv' }));
          // job details for the CorelDRAW macro (names the .cdr: Ticket - Customer - Project)
          await save('package_info.txt', new Blob([packageInfoText(info, total, pageNames)], { type: 'text/plain' }));
          if (zip) {
              btn.innerHTML = 'Zipping...';
              let blob = await zip.generateAsync({ type: 'blob' });
              if (fileHandle) { let w = await fileHandle.createWritable(); await w.write(blob); await w.close(); toast('Saved ' + fileHandle.name); }
              else saveBlob(blob, `${base}.zip`);
          }
      } catch (e) {
          alert('Export failed: ' + e.message);
      } finally {
          EXPORTING = false;
          btn.innerHTML = label;
      }
  }
</script>
