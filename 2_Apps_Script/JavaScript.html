<script>
  // =====================================================================
  //  SIGN PROOF GENERATOR v2.1  -  Proof Packages
  //  Step 1: pick any mix of products / components
  //  Step 2: fill in specs (sections paginate onto 11" x 8.5" proof sheets)
  //  Step 3: customer info, then export editable SVG + PNG per page (zip)
  //  Everything is driven by the Google Sheet:
  //    Product_Assembly, Component_Registry, Component_Schema, color tabs, Proof_Template
  // =====================================================================

  window.__JS_LOADED = true;
  const APP_VERSION = '2.1';
  let appData = {};
  let TEMPLATE = {};
  let selection = [];          // ordered keys: "P::<product>" or "C::<component id>"
  let pkgItems = [];           // [{iid, key, kind, name, defs:[...]}]
  let allParts = [];           // [{uid, iid, di, comp, title, include, enabled, overrides, num}]
  let itemSeq = 0, partSeq = 0;
  let modalItems = [], modalTarget = null;
  let renderTimer = null;
  let step = 'select';
  let customProducts = {}, customSeq = 0, customCompSeq = 0;   // 'X::n' -> {name}: custom tables built on screen (this package only)
  let excludedDrawings = {};   // 'iid|DRAWING_ID' -> true when unchecked in the Specs panel

  const CUSTOM_PAINT = "Custom Paint (SW / PMS)";
  const basicColorMap = {
      "WHITE": "#FFFFFF", "BLACK": "#000000", "GLOSS BLACK": "#000000", "CLEAR": "transparent",
      "RED": "#C1272D", "BRONZE": "#3B312B", "BLUE": "#004B87", "NICKEL": "#A8A9AD", "BRASS": "#C5A059",
      "GREEN": "#00FF00", "YELLOW": "#FFFF00"
  };

  // ---------- STARTUP ----------
  function showLoadError(msg) {
      window.__DATA_ARRIVED = true; // stops the startup watchdog from overwriting this message
      let el = document.getElementById('loading');
      if (el) { el.style.display = 'block'; el.innerHTML = '<span style="color:#c1272d;">Could not start the Proof Generator:</span><br><span style="font-weight:normal;font-size:14px;">' + esc(msg) + '</span>'; }
  }
  window.addEventListener('error', e => showLoadError((e.message || 'Script error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')));
  window.onload = function () {
      let slow = setTimeout(() => showLoadError('Still waiting for the Google Sheet after 30 seconds. Check Apps Script > Executions for a getAppData error.'), 30000);
      google.script.run
          .withSuccessHandler(raw => {
              clearTimeout(slow); window.__DATA_ARRIVED = true;
              try {
                  if (raw === null || raw === undefined) throw new Error('The server returned no data (getAppData returned empty).');
                  initApp(typeof raw === 'string' ? JSON.parse(raw) : raw);
              } catch (e) { console.error(e); showLoadError(e.message); }
          })
          .withFailureHandler(err => { clearTimeout(slow); showLoadError(err.message || String(err)); })
          .getAppData();
  };
  window.onclick = function (e) { if (e.target === document.getElementById('swatch-modal')) closeModal(); };

  function initApp(data) {
      appData = data;
      if (typeof PROOF_ASSETS === 'undefined' || !PROOF_ASSETS.loaded) throw new Error('The "Assets" HTML file is missing or incomplete in Apps Script. Re-paste Assets.html into a file named Assets.');
      if (!data.assemblies || !Object.keys(data.assemblies).length) throw new Error('No products found. Check that the Product_Assembly tab exists in this Google Sheet.');
      if (!data.components || !Object.keys(data.components).length) throw new Error('No components found. Check the Component_Registry and Component_Schema tabs.');
      TEMPLATE = data.template || {};
      appData.drawings = validDrawings(data.drawings || []);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('cf-rev').value = todayStr();
      renderDashboard();
      showStep('select');
  }

  // ---------- SMALL HELPERS ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // XML-safe for exported SVG: also writes non-ASCII characters as numeric entities (Illustrator / CorelDRAW safe)
  function escX(s) { return esc(s).replace(/[^\x00-\x7E]/g, ch => '&#' + ch.codePointAt(0) + ';'); }
  // Text for SVG <text> elements. CorelDRAW's SVG import prints entity codes (&quot; &#183;) literally,
  // so: quotes and other characters are written as-is (the file is UTF-8), dashes / dots are folded to
  // plain ASCII, and only text containing & or < (which XML must escape) is wrapped in CDATA.
  function xText(s) {
      let t = String(s == null ? '' : s)
          .replace(/[\u2012-\u2015]/g, '-').replace(/[\u00B7\u2022]/g, '-')
          .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\u2026/g, '...');
      return /[&<]/.test(t) ? '<![CDATA[' + t.replace(/\]\]>/g, ']] >') + ']]>' : t;
  }
  function splitOpts(s) { return String(s == null ? '' : s).split('|').map(x => x.trim()).filter(x => x !== ''); }
  function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'proof'; }
  function todayStr() { let d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}/${d.getFullYear()}`; }
  function cssBg(hex) {
      if (!hex || hex === 'transparent') return '#ffffff';
      if (hex.indexOf('http') !== -1) return `url('${hex}') center / cover`;
      return hex.charAt(0) === '#' ? hex : '#' + hex;
  }
  function normHex(hex) { if (!hex) return ''; if (hex === 'transparent') return 'transparent'; return hex.charAt(0) === '#' ? hex : '#' + hex; }
  function parseOverrides(str) {
      let o = {};
      String(str || '').split(';').forEach(pair => { let i = pair.indexOf('='); if (i > 0) o[pair.slice(0, i).trim().toUpperCase()] = pair.slice(i + 1).trim(); });
      return o;
  }
  function getModDb(key) {
      const map = { LED: 'colors_led', COIL: 'colors_coil', TRIMCAP: 'colors_trimcap', ACM: 'colors_acm', ACRYLIC: 'colors_acrylic',
                    PVC: 'colors_pvc', CORO: 'colors_coro', FINISH: 'colors_finish' };
      return appData[map[String(key).toUpperCase()]] || [];
  }
  function colorHex(name) {
      let n = String(name || '').toUpperCase();
      let hit = (appData.colors_finish || []).find(c => c.name.toUpperCase() === n);
      if (hit && hit.hex) return hit.hex;
      return basicColorMap[n] || '';
  }

  // =====================================================================
  //  STEP NAVIGATION
  // =====================================================================
  function showStep(s) {
      step = s;
      document.getElementById('step-select').style.display = s === 'select' ? 'flex' : 'none';
      document.getElementById('step-build').style.display = s === 'select' ? 'none' : 'flex';
      document.getElementById('builder-panel').style.display = s === 'specs' ? 'block' : 'none';
      document.getElementById('customer-panel').style.display = s === 'customer' ? 'block' : 'none';
      ['select', 'specs', 'customer'].forEach((k, i) => {
          let el = document.getElementById('stepper-' + k);
          if (el) el.className = 'step' + (k === s ? ' active' : (['select', 'specs', 'customer'].indexOf(s) > i ? ' done' : ''));
      });
      if (s !== 'select') schedulePreview();
  }

  function goSelect() { showStep('select'); }
  function goCustomer() { showStep('customer'); }
  function goSpecs() { showStep('specs'); }

  // =====================================================================
  //  STEP 1: DASHBOARD
  // =====================================================================
  function catalog() {
      let products = Object.keys(appData.assemblies || {}).sort((a, b) => a.localeCompare(b)).map(name => {
          let defs = appData.assemblies[name];
          let desc = defs.length === 1 && appData.components[defs[0].component]
              ? appData.components[defs[0].component].description
              : 'Built from: ' + defs.map(d => d.title || d.component).join(' + ');
          return { key: 'P::' + name, name: name, desc: desc };
      });
      let comps = Object.values(appData.components || {}).filter(c => c.tool).sort((a, b) => a.name.localeCompare(b.name))
          .map(c => ({ key: 'C::' + c.id, name: c.name, desc: c.description }));
      return { products, comps };
  }

  // =====================================================================
  //  DASHBOARD ICONS + COLOR FAMILIES (one-color line icons; the card outline uses the family color)
  // =====================================================================
  const SIGN_FAMILIES = {
      letters: { name: 'Channel Letters & Cloud Signs', color: '#1E6FD9' },
      cabinets: { name: 'Cabinets & Digital', color: '#7E3FC2' },
      ground: { name: 'Pole, Monument & Ground', color: '#D06F12' },
      panels: { name: 'Panels', color: '#23885A' },
      vinyl: { name: 'Vinyl & Banners', color: '#D0337A' },
      ada: { name: 'ADA', color: '#0E8A8A' },
      custom: { name: 'Custom', color: '#C1272D' },
      other: { name: 'Other', color: '#7A7F87' }
  };
  // first match wins: [name pattern, icon, family]
  const SIGN_ICON_RULES = [
      [/cloud sign.*halo/i, 'cloud_halo', 'letters'], [/cloud sign/i, 'cloud_fl', 'letters'],
      [/monument letters/i, 'mon_letters', 'letters'],
      [/halo|reverse/i, 'letters_halo', 'letters'], [/channel letter/i, 'letters_fl', 'letters'], [/backer panel/i, 'backer', 'letters'],
      [/routed letters/i, 'pvc_letters', 'panels'],
      [/digital sign|emc/i, 'emc', 'cabinets'], [/lighted cabinet/i, 'cabinet_lit', 'cabinets'], [/^cabinet$/i, 'cabinet', 'cabinets'],
      [/polycarbonate face/i, 'face_poly', 'cabinets'], [/routed aluminum face/i, 'face_routed', 'cabinets'],
      [/pole sign/i, 'pole_sign', 'ground'], [/pole cover/i, 'pole_cover', 'ground'], [/^poles?$/i, 'pole', 'ground'],
      [/monument base/i, 'mon_base', 'ground'], [/monument/i, 'monument', 'ground'], [/post and panel/i, 'post_panel', 'ground'],
      [/directional/i, 'directional', 'ground'], [/panel frame/i, 'frame', 'ground'],
      [/ada/i, 'ada', 'ada'],
      [/acm/i, 'acm', 'panels'], [/acrylic/i, 'acrylic', 'panels'], [/pvc/i, 'pvc', 'panels'], [/coro/i, 'coro', 'panels'],
      [/hdu/i, 'hdu', 'panels'], [/sign panel/i, 'panel', 'panels'],
      [/cut vinyl/i, 'vinyl_cut', 'vinyl'], [/digital print/i, 'vinyl_print', 'vinyl'], [/banner/i, 'banner', 'vinyl']
  ];
  const ST = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
  const FL = 'fill="currentColor"';
  const LTR = (y, sz, extra) => `<text x="20" y="${y}" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="${sz}" ${extra}>AB</text>`;
  const CLOUD = 'M11 31h18a6 6 0 0 0 1.5-11.8A8.5 8.5 0 0 0 14 16.6 7.2 7.2 0 0 0 11 31z';
  const SIGN_ICONS = {
      letters_fl: LTR(32, 19, FL) + `<path d="M9 9l2 3M20 6v4M31 9l-2 3" ${ST}/>`,
      letters_halo: LTR(30, 19, 'fill="none" stroke="currentColor" stroke-width="6" stroke-opacity=".3"') + LTR(30, 19, FL),
      cloud_fl: `<path d="${CLOUD}" ${FL}/><path d="M9 9l2 3M20 5v4M31 9l-2 3" ${ST}/>`,
      cloud_halo: `<path d="${CLOUD}" fill="none" stroke="currentColor" stroke-width="6" stroke-opacity=".3"/><path d="${CLOUD}" ${FL}/>`,
      mon_letters: LTR(25, 17, FL) + `<rect x="3" y="29" width="34" height="8" rx="1" ${FL} fill-opacity=".45"/>`,
      backer: `<rect x="4" y="9" width="32" height="22" rx="2" ${FL}/>` + LTR(26, 12, 'fill="#fff"'),
      pvc_letters: LTR(31, 19, 'fill="currentColor" fill-opacity=".35" transform="translate(2 2)"') + LTR(31, 19, FL),
      emc: [0, 1, 2].map(c => [0, 1].map(r => `<rect x="${6 + c * 10}" y="${10 + r * 10}" width="8.5" height="8.5" rx="1" ${FL}/>`).join('')).join(''),
      cabinet_lit: `<rect x="5" y="11" width="30" height="20" rx="2" ${ST}/><rect x="9" y="15" width="22" height="12" rx="1" ${FL}/><path d="M12 5l1.5 3M20 4v4M28 5l-1.5 3" ${ST}/>`,
      cabinet: `<path d="M5 14h24v20H5zM5 14l6-6h24l-6 6M29 34l6-6V8" ${ST}/>`,
      face_poly: `<rect x="5" y="8" width="30" height="24" rx="2" ${ST}/><path d="M11 26l8-12M17 26l8-12" ${ST} stroke-opacity=".6"/>`,
      face_routed: `<rect x="5" y="8" width="30" height="24" rx="2" ${FL}/>` + LTR(26, 12, 'fill="#fff"'),
      pole_sign: `<rect x="7" y="4" width="26" height="15" rx="1.5" ${FL}/><path d="M20 19v15M13 35h14" ${ST} stroke-width="3"/>`,
      pole_cover: `<path d="M20 4v18" ${ST} stroke-width="3"/><path d="M13 22h14l2 13H11z" ${FL}/>`,
      pole: `<path d="M20 4v25M8 29h24" ${ST} stroke-width="3"/><rect x="15" y="29" width="10" height="7" ${FL} fill-opacity=".45"/>`,
      mon_base: `<path d="M8 18h24l4 15H4z" ${FL}/>`,
      monument: `<rect x="7" y="8" width="26" height="15" rx="2" ${FL}/><rect x="4" y="25" width="32" height="8" rx="1" ${FL}/>`,
      post_panel: `<path d="M8 5v31M32 5v31" ${ST} stroke-width="3.5"/><rect x="11" y="9" width="18" height="14" rx="1" ${FL}/>`,
      directional: `<path d="M20 22v14" ${ST} stroke-width="3"/><rect x="5" y="6" width="30" height="16" rx="2" ${ST}/><path d="M11 14h15M21 10l5 4-5 4" ${ST}/>`,
      frame: `<rect x="5" y="7" width="30" height="26" rx="2" ${ST} stroke-width="3"/><rect x="11" y="13" width="18" height="14" ${ST} stroke-opacity=".5"/>`,
      ada: `<rect x="6" y="5" width="28" height="30" rx="3" ${ST}/><circle cx="20" cy="13" r="2.6" ${FL}/><path d="M16 23l4-6 4 6M20 17v-1" ${ST}/>` +
           [13, 18, 23, 28].map(x => `<circle cx="${x - 1.5}" cy="30" r="1.3" ${FL}/>`).join(''),
      acm: `<rect x="4" y="8" width="32" height="24" rx="1.5" ${FL}/>` + [[8, 12], [32, 12], [8, 28], [32, 28]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="1.6" fill="#fff"/>`).join(''),
      acrylic: `<rect x="4" y="8" width="32" height="24" rx="1.5" ${ST}/>` + [[9, 13], [31, 13], [9, 27], [31, 27]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" ${FL}/>`).join(''),
      pvc: `<path d="M4 12h28v22H4z" ${FL}/><path d="M4 12l4-4h28v22l-4 4M32 12l4-4" ${ST}/>`,
      coro: `<rect x="5" y="5" width="30" height="20" rx="1" ${ST}/><path d="M10 5v20M15 5v20M20 5v20M25 5v20M30 5v20" ${ST} stroke-width="1" stroke-opacity=".5"/><path d="M13 25v11M27 25v11M13 30h14" ${ST}/>`,
      hdu: `<rect x="4" y="7" width="32" height="26" rx="4" ${FL}/><rect x="8" y="11" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="7" ry="4" fill="#fff" fill-opacity=".85"/>`,
      panel: `<rect x="4" y="9" width="32" height="22" rx="2" ${FL}/>`,
      vinyl_cut: `<path d="M5 6h30v20l-9 9H5z" ${ST}/><path d="M35 26h-9v9" ${ST}/><text x="17" y="24" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" ${FL}>A</text>`,
      vinyl_print: `<path d="M5 6h30v20l-9 9H5z" ${FL}/><path d="M35 26h-9v9" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 26l7-9 5 6 3-3 4 6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`,
      banner: `<rect x="4" y="9" width="32" height="20" rx="1" ${FL}/>` + [7, 20, 33].map(x => `<circle cx="${x}" cy="12" r="1.5" fill="#fff"/><circle cx="${x}" cy="26" r="1.5" fill="#fff"/>`).join(''),
      custom: `<rect x="4" y="7" width="32" height="26" rx="2" ${ST}/><path d="M4 15h32M4 24h32M16 7v26" ${ST}/><path d="M28 27v-6M25 24h6" ${ST} stroke-width="2.4"/>`,
      generic: `<rect x="5" y="8" width="30" height="24" rx="2" ${ST}/>`
  };
  function signLook(name) {
      let r = SIGN_ICON_RULES.find(x => x[0].test(String(name || '')));
      let fam = SIGN_FAMILIES[r ? r[2] : 'other'];
      return { icon: SIGN_ICONS[r ? r[1] : 'generic'], color: fam.color, family: r ? r[2] : 'other' };
  }
  function iconSvg(icon) { return `<svg class="cat-svg" viewBox="0 0 40 40" aria-hidden="true">${icon}</svg>`; }
  // the color key doubles as a filter: toggle families on and off (none on = show everything)
  let familyFilter = [];
  function renderLegend() {
      let el = document.getElementById('cat-legend'); if (!el) return;
      el.innerHTML = Object.keys(SIGN_FAMILIES).filter(k => k !== 'other').map(k => {
          let on = familyFilter.indexOf(k) !== -1;
          return `<button type="button" class="legend-chip${on ? ' on' : ''}" style="--cat:${SIGN_FAMILIES[k].color}" aria-pressed="${on}" ` +
                 `title="${on ? 'Stop filtering by' : 'Show only'} ${esc(SIGN_FAMILIES[k].name)}" onclick="toggleFamily('${k}')"><i></i>${esc(SIGN_FAMILIES[k].name)}</button>`;
      }).join('') + (familyFilter.length ? `<button type="button" class="legend-clear" onclick="clearFamilies()">Show all</button>` : '');
  }
  function toggleFamily(k) {
      familyFilter = familyFilter.indexOf(k) === -1 ? familyFilter.concat(k) : familyFilter.filter(x => x !== k);
      renderLegend(); applyCatalogFilter();
  }
  function clearFamilies() { familyFilter = []; renderLegend(); applyCatalogFilter(); }

  function renderDashboard() {
      let cat = catalog();
      let card = c => { let look = signLook(c.name); return `<label class="cat-card" style="--cat:${look.color}" data-family="${look.family}" data-name="${esc(c.name.toLowerCase())}" id="card-${esc(c.key)}">
              <input type="checkbox" onchange="toggleSelect('${esc(c.key).replace(/'/g, "\\'")}', this.checked)">
              <span class="cat-icon">${iconSvg(look.icon)}</span>
              <div><div class="cat-name">${esc(c.name)}</div><div class="cat-desc">${esc(c.desc)}</div></div>
              <span class="cat-order"></span></label>`; };
      renderLegend();
      document.getElementById('cat-products').innerHTML = cat.products.map(card).join('');
      document.getElementById('cat-components').innerHTML = cat.comps.map(card).join('');
      renderCustomCards();
      updateSelectionBar();
  }

  // ---------- custom tables (main screen): name a custom product, then build its table on the specs step ----------
  function renderCustomCards() {
      let box = document.getElementById('cat-custom'); if (!box) return;
      box.innerHTML = Object.keys(customProducts).map(key => `<div class="cat-card custom-card" style="--cat:${SIGN_FAMILIES.custom.color}" data-family="custom" id="card-${key}" data-name="${esc(customProducts[key].name.toLowerCase())}">
              <input type="checkbox" onchange="toggleSelect('${key}', this.checked)">
              <span class="cat-icon">${iconSvg(SIGN_ICONS.custom)}</span>
              <div style="flex:1;"><input type="text" class="custom-name" id="cname-${key}" value="${esc(customProducts[key].name)}" maxlength="60"
                     title="Product name on the proof and the cover" oninput="renameCustomProduct('${key}', this.value)">
                <div class="cat-desc">Custom table: your own titles and descriptions, with swatches, materials and detail drawings</div></div>
              <span class="cat-order"></span><span class="part-remove custom-x" title="Remove this custom product" onclick="removeCustomProduct('${key}')">&times;</span></div>`).join('') +
          `<button type="button" class="custom-new" id="custom-new" onclick="addCustomProduct()"><b><span class="cat-icon">${iconSvg(SIGN_ICONS.custom)}</span>+ Build Custom Table</b>` +
          `<span>A product with a completely custom spec table: type each title and description, and use color swatches, materials, finishes and detail drawings</span></button>`;
  }
  function addCustomProduct() {
      let key = 'X::' + (++customSeq);
      customProducts[key] = { name: 'Custom Product' + (Object.keys(customProducts).length ? ' ' + (Object.keys(customProducts).length + 1) : '') };
      selection.push(key);
      renderCustomCards(); updateSelectionBar();
      let el = document.getElementById(`cname-${key}`); if (el) { el.focus(); el.select(); }
  }
  function renameCustomProduct(key, v) {
      let c = customProducts[key]; if (!c) return;
      c.name = String(v || '').trim() || 'Custom Product';
      let card = document.getElementById(`card-${key}`); if (card) card.dataset.name = c.name.toLowerCase();
      let it = pkgItems.find(x => x.key === key);
      if (it) {
          let d0 = it.defs[0];
          if (d0 && d0.title === it.name) {                       // first section follows the product name until renamed itself
              d0.title = c.name;
              allParts.filter(p => p.iid === it.iid && p.di === 0).forEach(p => { p.title = c.name; });
              let b = document.getElementById(`madd-${it.iid}-0`); if (b) b.innerHTML = `+ Add Another ${esc(c.name)}`;
              syncPartTitles();
          }
          it.name = c.name;
          let h = document.getElementById(`iname-${it.iid}`); if (h) h.innerText = c.name;
          [`cname-${key}`, `iname-in-${it.iid}`].forEach(id => { let el = document.getElementById(id); if (el && el !== document.activeElement) el.value = c.name; });
          schedulePreview();
      }
  }
  function removeCustomProduct(key) {
      delete customProducts[key];
      selection = selection.filter(k => k !== key);
      renderCustomCards(); updateSelectionBar();
  }

  function filterCatalog() { applyCatalogFilter(); }
  function applyCatalogFilter() {
      let q = ((document.getElementById('cat-search') || {}).value || '').trim().toLowerCase();
      document.querySelectorAll('.cat-card').forEach(c => {
          let fam = !familyFilter.length || familyFilter.indexOf(c.dataset.family) !== -1;
          c.style.display = fam && (!q || c.dataset.name.indexOf(q) !== -1) ? 'flex' : 'none';
      });
      // a section with nothing left to show hides with its heading; Custom shows when no filter is on or Custom is
      ['cat-products', 'cat-components'].forEach(id => {
          let grid = document.getElementById(id), any = [...grid.querySelectorAll('.cat-card')].some(c => c.style.display !== 'none');
          grid.style.display = any ? '' : 'none';
          if (grid.previousElementSibling && grid.previousElementSibling.tagName === 'H3') grid.previousElementSibling.style.display = any ? '' : 'none';
      });
      let cg = document.getElementById('cat-custom'), showCustom = !familyFilter.length || familyFilter.indexOf('custom') !== -1;
      if (cg) { cg.style.display = showCustom ? '' : 'none'; if (cg.previousElementSibling) cg.previousElementSibling.style.display = showCustom ? '' : 'none'; }
  }

  function toggleSelect(key, on) {
      selection = selection.filter(k => k !== key);
      if (on) selection.push(key);
      updateSelectionBar();
  }

  function updateSelectionBar() {
      document.querySelectorAll('.cat-card').forEach(c => {
          let key = c.id.slice(5), idx = selection.indexOf(key);
          c.classList.toggle('selected', idx !== -1);
          c.querySelector('input').checked = idx !== -1;
          c.querySelector('.cat-order').innerText = idx !== -1 ? idx + 1 : '';
      });
      let btn = document.getElementById('build-btn');
      btn.disabled = selection.length === 0;
      btn.innerText = selection.length ? `Build Proof Package (${selection.length} selected) \u2192` : 'Select at least one item';
  }

  function clearSelection() { selection = []; updateSelectionBar(); }

  function buildPackage() {
      if (!selection.length) return;
      // remove items no longer selected
      pkgItems.filter(it => selection.indexOf(it.key) === -1).forEach(it => {
          allParts = allParts.filter(p => p.iid !== it.iid);
          let el = document.getElementById(`item-${it.iid}`); if (el) el.remove();
      });
      pkgItems = pkgItems.filter(it => selection.indexOf(it.key) !== -1);
      // add new items, keep selection order
      let holder = document.getElementById('items');
      let ordered = [];
      selection.forEach(key => {
          let it = pkgItems.find(x => x.key === key) || createItem(key);
          ordered.push(it);
          holder.appendChild(document.getElementById(`item-${it.iid}`));
      });
      pkgItems = ordered;
      refreshAll();
      showStep('specs');
  }

  // =====================================================================
  //  STEP 2: BUILDER (items -> parts -> fields)
  // =====================================================================
  function createItem(key) {
      let iid = 'i' + (++itemSeq);
      let kind = key.slice(0, 1) === 'P' ? 'product' : (key.slice(0, 1) === 'X' ? 'custom' : 'component');
      let ref = key.slice(3);
      let defs, name;
      if (restoring) {                                         // reopening a saved proof: the saved sections, as saved
          name = restoring.item.name;
          defs = restoring.item.defs.map(d => Object.assign({}, d));
      } else if (kind === 'custom') {
          name = (customProducts[key] || {}).name || 'Custom Product';
          defs = [newCustomDef(name, 0)];
      } else if (kind === 'product') {
          name = ref;
          defs = (appData.assemblies[ref] || []).map(d => Object.assign({}, d));
      } else {
          let c = appData.components[ref];
          name = c.name;
          defs = [{ component: ref, title: c.name, include: 'Required', repeatable: c.repeatable, overrides: '', pageGroup: 1 }];
      }
      let it = { iid, key, kind, name, defs, blanks: [] };
      pkgItems.push(it);

      let panel = document.createElement('div');
      panel.className = 'item-panel';
      panel.id = `item-${iid}`;
      panel.innerHTML = `<div class="item-header" onclick="toggleItem('${iid}')">
                            <span class="item-name" id="iname-${iid}">${esc(name)}</span>
                            <span><span class="item-pages" id="ipages-${iid}"></span><span class="item-caret" id="icaret-${iid}">\u25BE</span></span>
                         </div>
                         <div class="item-body" id="ibody-${iid}"></div>`;
      document.getElementById('items').appendChild(panel);
      let body = panel.querySelector('.item-body');
      let ddBox = document.createElement('div');
      ddBox.className = 'item-drawings'; ddBox.id = `idraw-${iid}`; ddBox.style.display = 'none';
      if (kind === 'custom') {
          let nm = document.createElement('div');
          nm.className = 'custom-item-name';
          nm.innerHTML = `<label>PRODUCT NAME</label><input type="text" id="iname-in-${iid}" value="${esc(name)}" maxlength="60" oninput="renameCustomProduct('${key}', this.value)">`;
          body.appendChild(nm);
      }
      let groups = document.createElement('div');
      groups.id = `igroups-${iid}`;
      body.appendChild(groups);
      defs.forEach((d, di) => { if (!d.removed) addDefGroup(it, di); });
      if (kind === 'custom') {
          let bar = document.createElement('div');
          bar.className = 'custom-controls';
          let opts = Object.values(appData.components).filter(c => !c.custom).sort((a, b) => a.name.localeCompare(b.name))
              .map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
          bar.innerHTML = `<button type="button" class="swatch-btn add-part-btn" onclick="addCustomSection('${iid}')" title="Another custom table section with its own name and rows">+ Add Section</button>` +
                          `<select class="custom-add-comp" onchange="addComponentToItem('${iid}', this.value); this.value = '';" title="Add an existing component (poles, illumination, footer...) to this product">` +
                          `<option value="">+ Add Component...</option>${opts}</select>`;
          body.appendChild(bar);
      }
      body.appendChild(ddBox);
      let blankBox = document.createElement('div');
      blankBox.className = 'item-blanks'; blankBox.id = `iblank-${iid}`;
      body.appendChild(blankBox);
      let blankBtn = document.createElement('button');
      blankBtn.type = 'button'; blankBtn.className = 'swatch-btn add-part-btn'; blankBtn.innerHTML = '+ Add Blank Page';
      blankBtn.title = 'A proof page with the sidebar filled in and an empty art board (for elevations, mockups, site photos)';
      blankBtn.onclick = function () { addBlank(it); };
      body.appendChild(blankBtn);
      return it;
  }

  function addDefGroup(it, di) {
      let d = it.defs[di], iid = it.iid;
      let group = document.createElement('div');
      group.id = `mgroup-${iid}-${di}`;
      document.getElementById(`igroups-${iid}`).appendChild(group);
      if (!appData.components[d.component]) { group.innerHTML = `<div class="part-card" style="color:#c1272d;">Unknown Component_ID: ${esc(d.component)}</div>`; return; }
      addPart(it, di);
      {                                                         // every product / component section can be added again
          let btn = document.createElement('button'), clone = CLONE_COMPONENTS.indexOf(d.component) !== -1 || !!appData.components[d.component].custom;
          btn.type = 'button'; btn.className = 'swatch-btn add-part-btn'; btn.id = `madd-${iid}-${di}`;
          btn.innerHTML = `+ Add Another ${esc(d.title || appData.components[d.component].name)}`;
          if (clone) btn.title = 'Adds another full section with the same settings as the one above; edit what differs';
          btn.onclick = function () { addPart(it, di, clone); refreshAll(); };
          group.appendChild(btn);
      }
  }

  // =====================================================================
  //  CUSTOM TABLES: each section is a component made on screen; every row = a title + a description
  // =====================================================================
  const CUSTOM_TYPES = [
      { k: 'text', n: 'Text', type: 'text' },
      { k: 'dims2', n: 'Size W x H', type: 'dims', options: 'W|H' },
      { k: 'dims3', n: 'Size W x H x D', type: 'dims', options: 'W|H|D' },
      { k: 'paint', n: 'Paint color (SW / PMS)', type: 'paint' },
      { k: 'finish', n: 'Finish', type: 'finish' },
      { k: 'vinyl', n: 'Vinyl (Oracal)', type: 'vinyl' },
      { k: 'ACM', n: 'ACM color', type: 'db', options: 'ACM' },
      { k: 'ACRYLIC', n: 'Acrylic color', type: 'db', options: 'ACRYLIC' },
      { k: 'PVC', n: 'PVC color', type: 'db', options: 'PVC' },
      { k: 'CORO', n: 'Coroplast color', type: 'db', options: 'CORO' },
      { k: 'TRIMCAP', n: 'Trim cap color', type: 'db', options: 'TRIMCAP' },
      { k: 'COIL', n: 'Return / coil color', type: 'db', options: 'COIL' },
      { k: 'LED', n: 'LED color', type: 'db', options: 'LED' },
      { k: 'rowmark', n: 'Rowmark (ADA)', type: 'rowmark' },
      { k: 'pictogram', n: 'ADA pictogram', type: 'pictogram' }
  ];
  function customTypeOptions(t) {
      if (t.k === 'finish') return (appData.colors_finish || []).map(c => c.name).filter(Boolean).join('|') || 'Black|White|Bronze|Brushed Aluminum';
      if (t.k === 'vinyl') {
          let ser = [];
          (appData.colors_oracal || []).forEach(c => { let v = String(c.series).replace(/\.0$/, '').trim(); if (v && ser.indexOf(v) === -1) ser.push(v); });
          return ser.join('|');
      }
      return t.options || '';
  }
  function customField(k, title, col, def) {
      let t = CUSTOM_TYPES.find(x => x.k === k) || CUSTOM_TYPES[0], lab = String(title || '').trim().toUpperCase();
      return { zone: 'COLUMN ' + (col || 1), variable: lab, label: lab, type: t.type, ck: t.k, def: def || '', options: customTypeOptions(t),
               showIf: '', required: !!lab, notes: '', hideValues: '', custom: true };
  }
  function newCustomDef(title, di) {
      let id = 'CUSTOM_' + (++customCompSeq);
      appData.components[id] = { id, name: title, description: 'Custom table', tool: false, repeatable: true, custom: true,
          fields: [customField('text', 'QUANTITY', 1, '1'), customField('dims2', 'SIZE', 1), customField('text', '', 2), customField('text', '', 2)] };
      return { component: id, title, include: 'Required', repeatable: true, overrides: '', pageGroup: di + 1 };
  }
  function addCustomSection(iid) {
      let it = pkgItems.find(x => x.iid === iid); if (!it) return;
      let n = it.defs.filter(d => !d.removed && appData.components[d.component] && appData.components[d.component].custom).length + 1;
      it.defs.push(newCustomDef('Section ' + n, it.defs.length));
      addDefGroup(it, it.defs.length - 1);
      refreshAll();
  }
  function addComponentToItem(iid, compId) {
      let it = pkgItems.find(x => x.iid === iid), c = appData.components[compId]; if (!it || !c) return;
      it.defs.push({ component: compId, title: c.name, include: 'Required', repeatable: c.repeatable, overrides: '', pageGroup: it.defs.length + 1 });
      addDefGroup(it, it.defs.length - 1);
      refreshAll();
  }
  function customRowHtml(part, f, fi) {
      let fid = `${part.uid}_${fi}`, cid = part.comp, col = Number(String(f.zone).replace(/\D/g, '')) || 1;
      return `<div class="cr-row" id="cr-${fid}">
                <div class="cr-head">
                  <input type="text" class="cr-title" id="crt-${fid}" value="${esc(f.label)}" placeholder="Title (e.g. FACE)" maxlength="40" spellcheck="false"
                         title="Row title on the proof" oninput="setCustomTitle('${cid}', ${fi}, this.value)">
                  <select class="cr-type" id="crk-${fid}" title="Kind of description" onchange="setCustomType('${cid}', ${fi}, this.value)">` +
                    CUSTOM_TYPES.map(t => `<option value="${t.k}" ${t.k === f.ck ? 'selected' : ''}>${esc(t.n)}</option>`).join('') + `</select>
                  <select class="cr-col" id="crc-${fid}" title="Column on the proof table" onchange="setCustomCol('${cid}', ${fi}, this.value)">` +
                    [1, 2, 3, 4, 5, 6].map(n => `<option value="${n}" ${n === col ? 'selected' : ''}>Col ${n}</option>`).join('') + `</select>
                  <span class="part-remove cr-x" title="Remove this row" onclick="removeCustomRow('${cid}', ${fi})">&times;</span>
                </div>` + renderField(part, f, fi) + `</div>`;
  }
  function customDrawingsHtml(part) {
      let list = (appData.drawings || []).slice().sort((a, b) => a.order - b.order);
      return `<details class="cr-draw"><summary>Detail drawings (<span id="crdn-${part.uid}">${part.drawPick.length}</span> picked)</summary><div class="cr-draw-list">` +
          list.map(d => `<label class="dd-chip"><input type="checkbox" id="crd-${part.uid}-${esc(d.id)}" ${part.drawPick.indexOf(d.id) !== -1 ? 'checked' : ''} ` +
                        `onchange="pickCustomDrawing('${part.uid}', '${esc(d.id)}', this.checked)"> ${esc(d.title)}</label>`).join('') + `</div></details>`;
  }
  function pickCustomDrawing(uid, id, on) {
      let p = allParts.find(x => x.uid === uid); if (!p) return;
      p.drawPick = p.drawPick.filter(x => x !== id); if (on) p.drawPick.push(id);
      let n = document.getElementById(`crdn-${uid}`); if (n) n.innerText = p.drawPick.length;
      schedulePreview();
  }
  function customParts(cid) { return allParts.filter(p => p.comp === cid); }
  function placeholders(part, fi) {
      let el = document.getElementById(`mf-${part.uid}_${fi}`); if (el && el.tagName === 'INPUT' && el.type === 'text') el.placeholder = 'Description';
  }
  function addCustomRow(uid) {
      let part = allParts.find(x => x.uid === uid); if (!part) return;
      let comp = appData.components[part.comp], last = comp.fields.filter(f => !f.removed).pop();
      comp.fields.push(customField('text', '', last ? Number(String(last.zone).replace(/\D/g, '')) || 1 : 1));
      let fi = comp.fields.length - 1;
      customParts(part.comp).forEach(p => {
          let box = document.getElementById(`crows-${p.uid}`); if (!box) return;
          box.insertAdjacentHTML('beforeend', customRowHtml(p, comp.fields[fi], fi)); placeholders(p, fi);
      });
      let t = document.getElementById(`crt-${uid}_${fi}`); if (t) t.focus();
      refreshAll();
  }
  function setCustomTitle(cid, fi, v) {
      let f = appData.components[cid].fields[fi], lab = String(v || '').trim().toUpperCase();
      f.label = f.variable = lab; f.required = !!lab;
      customParts(cid).forEach(p => { let el = document.getElementById(`crt-${p.uid}_${fi}`); if (el && el !== document.activeElement) el.value = lab; });
      refreshAll();
  }
  function setCustomCol(cid, fi, n) {
      appData.components[cid].fields[fi].zone = 'COLUMN ' + n;
      customParts(cid).forEach(p => { let el = document.getElementById(`crc-${p.uid}_${fi}`); if (el) el.value = n; });
      refreshAll();
  }
  function setCustomType(cid, fi, k) {
      let f = appData.components[cid].fields[fi], t = CUSTOM_TYPES.find(x => x.k === k) || CUSTOM_TYPES[0];
      Object.assign(f, { type: t.type, ck: t.k, options: customTypeOptions(t), def: '' });
      customParts(cid).forEach(p => {
          delete p.colorLines[fi];
          let row = document.getElementById(`cr-${p.uid}_${fi}`); if (!row) return;
          row.outerHTML = customRowHtml(p, f, fi); placeholders(p, fi);
      });
      refreshAll();
  }
  function removeCustomRow(cid, fi) {
      appData.components[cid].fields[fi].removed = true;
      customParts(cid).forEach(p => { let row = document.getElementById(`cr-${p.uid}_${fi}`); if (row) row.remove(); });
      refreshAll();
  }
  // table columns in order; custom tables sort by column number and skip removed rows
  function compZones(comp) {
      let zones = [];
      comp.fields.forEach(f => { if (!f.removed && zones.indexOf(f.zone) === -1) zones.push(f.zone); });
      if (comp.custom) zones.sort((a, b) => (Number(String(a).replace(/\D/g, '')) || 0) - (Number(String(b).replace(/\D/g, '')) || 0));
      return zones;
  }

  // ---------- blank pages: sidebar + watermark, empty art board, editable title (default "Page") ----------
  let blankSeq = 0;
  function addBlank(it) { it.blanks.push({ id: 'b' + (++blankSeq), title: 'Page' }); renderBlanks(it); schedulePreview(); }
  function removeBlank(iid, bid) { let it = pkgItems.find(x => x.iid === iid); if (!it) return; it.blanks = it.blanks.filter(b => b.id !== bid); renderBlanks(it); schedulePreview(); }
  function renameBlank(iid, bid, v) { let it = pkgItems.find(x => x.iid === iid), b = it && it.blanks.find(x => x.id === bid); if (b) { b.title = v; schedulePreview(); } }
  function renderBlanks(it) {
      let box = document.getElementById(`iblank-${it.iid}`); if (!box) return;
      box.innerHTML = it.blanks.map((b, i) => `<div class="blank-row"><span class="blank-lab">Blank page ${i + 1}</span>` +
          `<input type="text" value="${esc(b.title)}" maxlength="40" placeholder="Page" title="Title shown on the page and in the cover contents" oninput="renameBlank('${it.iid}', '${b.id}', this.value)">` +
          `<span class="part-remove" onclick="removeBlank('${it.iid}', '${b.id}')">[x] Remove</span></div>`).join('');
  }
  function blankTitle(b) { return String(b.title || '').trim() || 'Page'; }

  function toggleItem(iid) {
      let b = document.getElementById(`ibody-${iid}`), c = document.getElementById(`icaret-${iid}`);
      let open = b.style.display !== 'none';
      b.style.display = open ? 'none' : 'block';
      c.innerText = open ? '\u25B8' : '\u25BE';
  }

  // channel letter components: "+ Add Letters" copies the previous letter set's settings into the new one
  const CLONE_COMPONENTS = ['CHANNEL_LETTERS_FL', 'HALO_LETTERS', 'CLOUD_SIGN_FL', 'CLOUD_SIGN_HALO', 'MONUMENT_LETTERS'];
  function copyPartValues(fromUid, toUid) {
      let src = document.getElementById(`part-${fromUid}`), dst = document.getElementById(`part-${toUid}`);
      if (!src || !dst) return;
      src.querySelectorAll('[id]').forEach(el => {
          if (el.id.indexOf(`${fromUid}_`) === -1) return;          // field elements only (not the title, notes or page toggles)
          let twin = document.getElementById(el.id.replace(`${fromUid}_`, `${toUid}_`)); if (!twin) return;
          if (el.type === 'checkbox') twin.checked = el.checked;
          else if ('value' in el && el.tagName !== 'BUTTON') twin.value = el.value;
          else if (el.tagName === 'SPAN' && /^mtxt-/.test(el.id)) twin.innerText = el.innerText;
          if (/^mcol-/.test(el.id)) { twin.style.background = el.style.background; twin.innerHTML = el.innerHTML; }
          if (el.style && el.style.display) twin.style.display = el.style.display;
          if (el.classList && el.classList.contains('cc-approx')) twin.classList.add('cc-approx');
      });
  }

  // ---------- extra letter lines (QTY / LETTER HEIGHT / TEXT) inside one channel letter section ----------
  let lineSeq = 0;
  function hasLetterLines(comp) {
      let v = comp.fields.map(f => f.variable.toUpperCase());
      return v.indexOf('TEXT') !== -1 && v.indexOf('LETTER HEIGHT') !== -1 && comp.fields.some(f => f.type === 'autoqty');
  }
  function letterCount(t) { return String(t || '').replace(/\s/g, '').length; }
  function addLetterLine(uid) {
      let p = allParts.find(x => x.uid === uid); if (!p) return;
      let last = p.letterLines[p.letterLines.length - 1];
      p.letterLines.push({ id: 'L' + (++lineSeq), height: last ? last.height : getRaw(p, 'LETTER HEIGHT'), text: '' });
      renderLetterLines(p); schedulePreview();
      let box = document.getElementById(`pline-text-${p.letterLines[p.letterLines.length - 1].id}`); if (box) box.focus();
  }
  function removeLetterLine(uid, id) { let p = allParts.find(x => x.uid === uid); if (!p) return; p.letterLines = p.letterLines.filter(l => l.id !== id); renderLetterLines(p); schedulePreview(); }
  function setLetterLine(uid, id, key, v) {
      let p = allParts.find(x => x.uid === uid), l = p && p.letterLines.find(x => x.id === id); if (!l) return;
      l[key] = v;
      let q = document.getElementById(`pline-qty-${id}`); if (q) q.value = letterCount(l.text);
      schedulePreview();
  }
  function renderLetterLines(p) {
      let box = document.getElementById(`plines-${p.uid}`); if (!box) return;
      box.innerHTML = p.letterLines.map(l => `<div class="zone-row letter-line">
            <div class="form-group"><label>QUANTITY</label><input type="number" id="pline-qty-${l.id}" value="${letterCount(l.text)}" readonly style="background:#f0f0f0;" title="Counted from TEXT"></div>
            <div class="form-group"><label>LETTER HEIGHT *</label><input type="number" value="${esc(l.height)}" oninput="setLetterLine('${p.uid}', '${l.id}', 'height', this.value)"></div>
            <div class="flex-break"></div>
            <div class="form-group wide-field"><label>TEXT * <span class="part-remove" onclick="removeLetterLine('${p.uid}', '${l.id}')">[x] Remove</span></label>
              <input type="text" id="pline-text-${l.id}" value="${esc(l.text)}" oninput="setLetterLine('${p.uid}', '${l.id}', 'text', this.value)"></div>
          </div>`).join('');
  }
  // proof rows for the extra lines, right after the section's own TEXT row
  function letterLineItems(part, zone) {
      let out = [];
      (part.letterLines || []).forEach(l => {
          let h = String(l.height || '').replace(/"/g, '').trim(), t = String(l.text || '').trim();
          out.push(h ? { zone, label: 'QTY / HEIGHT', variable: 'QUANTITY', type: 'autoqty', val: `${letterCount(t)} @ ${h}"`, hex: '' }
                     : { zone, label: 'QTY / HEIGHT', variable: 'QUANTITY', type: 'autoqty', val: 'Enter LETTER HEIGHT', hex: '', warn: true, warnLabel: 'MISSING' });
          out.push(t ? { zone, label: 'TEXT', variable: 'TEXT', type: 'text', val: `"${t}"`, hex: '' }
                     : { zone, label: 'TEXT', variable: 'TEXT', type: 'text', val: 'Enter TEXT', hex: '', warn: true, warnLabel: 'MISSING' });
      });
      return out;
  }

  function addPart(it, di, clone) {
      let d = it.defs[di];
      let comp = appData.components[d.component];
      let num = allParts.filter(p => p.iid === it.iid && p.di === di).length + 1;
      let uid = 'p' + (++partSeq);
      let optional = d.include !== 'Required';
      let prevPart = clone ? allParts.filter(p => p.iid === it.iid && p.di === di).pop() : null;
      let part = { uid, iid: it.iid, di, comp: d.component, title: d.title || comp.name, custom: '', notesOn: false, notes: '', newPage: false, letterLines: [], drawPick: [], colorLines: {}, colorSeq: 0, include: d.include,
                   enabled: d.include !== 'Optional-Off' || num > 1, overrides: parseOverrides(d.overrides), num };   // an added copy is always included
      if (prevPart) { Object.keys(prevPart.colorLines).forEach(k => { part.colorLines[k] = prevPart.colorLines[k].slice(); }); part.colorSeq = prevPart.colorSeq; }
      if (restoring) takeSavedPart(part);
      allParts.push(part);

      let zones = [];
      comp.fields.forEach(f => { if (zones.indexOf(f.zone) === -1) zones.push(f.zone); });
      let html = `<div class="part-header">
                    <input type="text" class="part-title-input" id="ptitle-${uid}" maxlength="40" spellcheck="false"
                           title="Section name on the proof - click to rename (e.g. Front Menu)"
                           value="${esc(partDefault(part))}" placeholder="${esc(partDefault(part))}"
                           oninput="renamePart('${uid}', this.value)" onblur="renameDone('${uid}')"
                           onkeydown="if (event.key === 'Enter') this.blur()">
                    <span>
                      <label class="part-toggle" title="Start this section's table on a new proof page"><input type="checkbox" id="pnew-${uid}" onchange="togglePartNewPage('${uid}')"> New page</label>
                      ${optional && num === 1 ? `<label class="part-toggle"><input type="checkbox" id="pinc-${uid}" ${part.enabled ? 'checked' : ''} onchange="togglePart('${uid}')"> Include</label>` : ''}
                      ${num > 1 || it.kind === 'custom' ? `<span class="part-remove" onclick="removePart('${uid}')">[x] Remove</span>` : ''}
                    </span>
                  </div>
                  <div class="part-body" id="pbody-${uid}" style="display:${part.enabled ? 'block' : 'none'};">`;
      let lettersZone = hasLetterLines(comp) ? comp.fields.find(f => f.variable.toUpperCase() === 'TEXT').zone : null;
      if (comp.custom) {
          html += `<div class="zone-group custom-rows"><div class="cr-legend"><span>TITLE</span><span>DESCRIPTION TYPE</span><span>COLUMN</span></div><div id="crows-${uid}">`;
          comp.fields.forEach((f, fi) => { if (!f.removed) html += customRowHtml(part, f, fi); });
          html += `</div><button type="button" class="swatch-btn add-letters-btn" onclick="addCustomRow('${uid}')" title="Another title + description row">+ Add Row</button></div>`;
          html += customDrawingsHtml(part);
          zones = [];
      }
      zones.forEach(z => {
          html += `<div class="zone-group"><div class="zone-row">`;
          comp.fields.forEach((f, fi) => { if (f.zone === z) html += renderField(part, f, fi); });
          html += `</div>`;

  function ccNum(id, max) { let el = document.getElementById(id); if (!el || el.value === '') return null; let v = Math.round(Number(el.value)); return isNaN(v) ? null : Math.max(0, Math.min(max, v)); }
  function ccInput(fid, set) {

  // ---------- closest library colors (Sherwin-Williams, Pantone, Oracal) to a custom color: CIEDE2000 on the hex values ----------

  let LIB_LAB = null;
  function libraryLab() {

      let sw = (appData.colors_sw || []).map(c => {
