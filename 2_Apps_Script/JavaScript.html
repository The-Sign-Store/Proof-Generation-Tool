  function shortBase(info, base) {
      let t = String(info.ticket == null ? '' : info.ticket).replace(/[\\\/:*?"<>|\t\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '');
      if (t) return t.slice(0, 24).trim();
      let b = base;
      if (b.length > 24) { b = b.slice(0, 24); let cut = b.lastIndexOf(' '); if (cut > 10) b = b.slice(0, cut); b = b.replace(/[^A-Za-z0-9)\]]+$/, ''); }
      return b || 'Proof';
  }

  // package_info.txt: plain key=value lines read by the CorelDRAW ImportProofPackage macro
  function packageInfoText(info, total, pageNames) {
      let clean = v => String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').trim();
      return [['Ticket', info.ticket], ['Customer', info.name], ['SubCustomer', info.sub], ['Project', info.project], ['Invoice', info.inv],
              ['Salesperson', info.sales], ['Designer', info.designer], ['Location', info.location],
              ['OriginalDate', info.orig], ['RevisionDate', info.rev], ['FileLocation', info.path], ['Pages', total],
              ['FileBase', exportBase(info)]].concat(pageNames || [])
          .map(([k, v]) => k + '=' + clean(v)).join('\r\n') + '\r\n';
  }

  // one zip export: asks where to save first (Chrome / Edge, when allowed), shows progress on the button
  async function exportZip(btn, zipName, fill) {
      let zip = (typeof JSZip !== 'undefined') ? new JSZip() : null, fileHandle = null;
      // the browser only allows the Save As window right after the click
      if (zip && window.showSaveFilePicker) {
          try {
              fileHandle = await window.showSaveFilePicker({ suggestedName: zipName, types: [{ description: 'Zip file', accept: { 'application/zip': ['.zip'] } }] });
          } catch (e) {
              if (e && e.name === 'AbortError') return false;   // Cancel
              fileHandle = null;                                // blocked here: normal download
          }
      }
      closeExportMenu();
      let label = btn.innerHTML; btn.disabled = true;
      let save = async (name, blob) => {
          if (zip) zip.file(name, blob);
          else { saveBlob(blob, name.split('/').pop()); await new Promise(r => setTimeout(r, 400)); }
      };
      try {
          EXPORTING = true;
          await fill(save, msg => { btn.innerHTML = esc(msg); }, !!zip);
          if (zip) {
              btn.innerHTML = 'Zipping...';
              let blob = await zip.generateAsync({ type: 'blob' });
              if (fileHandle) { let w = await fileHandle.createWritable(); await w.write(blob); await w.close(); toast('Saved ' + fileHandle.name); }
              else saveBlob(blob, zipName);
          }
          return true;
      } catch (e) {
          alert('Export failed: ' + e.message); return false;
      } finally {
          EXPORTING = false;
          btn.innerHTML = label; btn.disabled = false;
      }
  }
  function missingCustomerOk(what) {
      let info = getCustomerInfo();
      let keys = /production/.test(what) ? ['name', 'project', 'location', 'sales', 'inv', 'designer'] : ['name', 'project', 'location', 'sales', 'inv', 'ticket', 'designer', 'orig', 'path'];
      let missing = (info.hasSub && !info.sub ? ['sub'] : []).concat(keys.filter(k => !info[k]));
      return !missing.length || confirm(`${missing.length} job info field(s) are empty and will print as yellow MISSING tags.\nExport the ${what} anyway?`);
  }

  // DESIGN PROOF: [cover page] + proof pages + Proof Summary, SVG only (ready for CorelDRAW) + package_info.txt for the macro
  let exportWhat = 'design';
  function askDesignExport(what) {
      exportWhat = what || 'design';
      closeExportMenu();
      if (!packagePages().length) { toast('Add a product on the Design tab first.'); return; }
      document.getElementById('cover-modal').style.display = 'flex';
      document.getElementById('cover-yes').focus();
  }
  function closeCoverDialog() { document.getElementById('cover-modal').style.display = 'none'; }
  function exportChosen(cover) { return exportWhat === 'all' ? generateAll(cover) : generatePackage(cover); }
  // the design proof pages into a zip folder (prefix "" or "Design Proof/")
  async function fillDesign(save, progress, zipped, cover, prefix) {
      let pages = packagePages(), info = getCustomerInfo(), base = exportBase(info), off = withCover ? 1 : 0, total = summaryTotal(pages), pad = n => String(n).padStart(2, '0');
      let fb = zipped ? shortBase(info, base) : base, pageNames = [], jobs = [];
      ART_PHASE = 'design';
      try {
          if (withCover) { jobs.push(() => buildTitlePageSVG(info, 1, total)); pageNames.push(['Page01', 'COVER']); }
          pages.forEach((p, i) => { jobs.push(() => buildSheetSVG(p, i + 1 + off, total, info)); pageNames.push([`Page${pad(i + 1 + off)}`, `${prName(p.item).toUpperCase()}${p.blank ? ' ' + String(p.title).toUpperCase() : ''} ${p.n}/${p.total}`]); });
          jobs.push(() => buildCoverSVG(pages, info, total)); pageNames.push([`Page${pad(total)}`, 'PROOF SUMMARY']);
          for (let i = 0; i < jobs.length; i++) {
              progress(`Design page ${i + 1} of ${jobs.length}...`);
              let svg = jobs[i]();
              await save(`${prefix}SVG/${fb} - p${pad(i + 1)}.svg`, new Blob([svg], { type: 'image/svg+xml' }));
              await save(`${prefix}PNG/${fb} - p${pad(i + 1)}.png`, await svgToPngBlob(svg, 3300, 2550));
          }
      } finally { ART_PHASE = null; }
      await save(`${prefix}package_info.txt`, new Blob([packageInfoText(info, total, pageNames)], { type: 'text/plain' }));
  }
  async function generatePackage(cover) {
      let pages = packagePages();
      if (!pages.length) { toast('Add a product on the Design tab first.'); return; }
      if (!missingCustomerOk('design package')) return;
      let info = getCustomerInfo(), base = exportBase(info);
      let r = await exportZip(exportBtn(), `${base} - Design Proof.zip`, (save, progress, zipped) => fillDesign(save, progress, zipped, withCover, ''));
      if (r) { exportedPhase.design = true; updateStepper(); }
      return r;
  }
  async function generateAll(cover) {
      let pages = packagePages();
      if (!pages.length) { toast('Add a product on the Design tab first.'); return; }
      if (!missingCustomerOk('design and production packages')) return;
      let info = getCustomerInfo(), base = exportBase(info);
      return await exportZip(document.getElementById('export-btn'), `${base} - All.zip`, async (save, progress, zipped) => {
          await fillDesign(save, progress, zipped, !!cover, 'Design Proof/');
          await fillProduction(save, progress, zipped, 'Production/');
      });
  }

  // PRODUCTION PACKAGE: QA sheet (SVG, PNG, print PDF, CSV) + production proofs and the color chart (SVG, PNG, print PDF)
  function prodInfo(info) { return Object.assign({}, info, { ticket: '' }); }      // production files: no design ticket #
  async function generateProduction() {
      closeExportMenu();
      let pages = packagePages();
      if (!pages.length) { toast('Add a product on the Design tab first.'); return; }
      if (!missingCustomerOk('production package')) return;
      let info = getCustomerInfo(), base = exportBase(prodInfo(info));
      let r = await exportZip(exportBtn(), `${base} - Production.zip`, (save, progress, zipped) => fillProduction(save, progress, zipped, ''));
      if (r) { exportedPhase.production = true; updateStepper(); }
      return r;
  }
  // production package = SVG + PDF only: QA sheet, production proofs, snapshot and department sheets
  async function fillProduction(save, progress, zipped, prefix) {
      ART_PHASE = 'production';
      try { return await fillProductionInner(save, progress, zipped, prefix); } finally { ART_PHASE = null; }
  }
  async function fillProductionInner(save, progress, zipped, prefix) {
      let pages = packagePages(), info = getCustomerInfo(), base = exportBase(prodInfo(info)), total = summaryTotal(pages), pad = n => String(n).padStart(2, '0');
      let fb = zipped ? shortBase(prodInfo(info), base) : base, jobs = [], jpegs = [];
      pages.forEach((p, i) => jobs.push({ file: `${fb} - prod${pad(i + 1)}`, svg: () => buildProductionSVG(p, i + 1, pages.length, info) }));
      jobs.push({ file: `${fb} - prod${pad(pages.length + 1)} - snapshot`, svg: () => buildSnapshotSVG(pages, info) });
      buildDeptSheets(pages, info).forEach((d, k) => jobs.push({ file: `${fb} - prod${pad(pages.length + 2 + k)} - dept ${d.slug}`, svg: () => d.svg }));
      if (qaOn()) buildQAPages(pages, info, total).forEach((svg, i) => jobs.push({ file: `${fb} - qa${pad(i + 1)}`, svg: () => svg, w: 2550, h: 3300 }));   // v4.3: QA last
      for (let i = 0; i < jobs.length; i++) {
          progress(`Production page ${i + 1} of ${jobs.length}...`);
          svgToPngBlob.wantJpeg = true;
          let png;
          try { png = await svgToPngBlob(jobs[i].svg(), jobs[i].w || 3300, jobs[i].h || 2550); } finally { svgToPngBlob.wantJpeg = false; }
          if (png.jpeg) jpegs.push(png.jpeg);
          await save(`${prefix}SVG/${jobs[i].file}.svg`, new Blob([jobs[i].svg()], { type: 'image/svg+xml' }));
          await save(`${prefix}PNG/${jobs[i].file}.png`, png);
      }
      if (jpegs.length) await save(`${prefix}${fb} - Production package.pdf`, jpegPagesToPdf(jpegs, `${base} - Production package`));
  }

  // home footer: the current year
  (function () { let y = document.getElementById('copy-year'); if (y) y.textContent = String(new Date().getFullYear()); })();
</script>
